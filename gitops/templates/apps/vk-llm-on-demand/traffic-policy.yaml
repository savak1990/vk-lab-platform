{{- if ne .Values.target "local" }}
{{- range $ns := list "llm" "llm-dev" }}
---
# On-demand mode can hold a chat request while the GPU starts, so the route
# timeout is the 600 s wait plus generationTimeout (600 s). Envoy Gateway
# v1.2.1 exposes no stream idle timeout on this policy; the default applies.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: gpu-on-demand-traffic-policy
  namespace: {{ $ns }}
  annotations:
    # One after the pointer; the HTTPRoute comes later - from the child
    # Application in llm, from the pipeline in llm-dev - so SkipDryRun
    # plus selfHeal cover a first-apply miss.
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gpu-on-demand
  timeout:
    http:
      requestTimeout: 1200s
{{- end }}
{{- end }}
