{{- if ne .Values.target "local" }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: vk-llm-chat
  namespace: argocd
  annotations:
    # Before the pointer at wave 5: an Application naming a project that does
    # not exist yet is rejected outright, not retried.
    argocd.argoproj.io/sync-wave: "4"
spec:
  description: The household chat front end. vk-llm-on-demand's chat/ chart owns everything below the pointer.
  sourceRepos:
    - https://github.com/savak1990/vk-llm-on-demand
  destinations:
    - server: https://kubernetes.default.svc
      namespace: chat
  # No cluster-scoped kinds: namespace chat is created by the platform.
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
{{- end }}
