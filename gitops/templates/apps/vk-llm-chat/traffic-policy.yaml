{{- if ne .Values.target "local" }}
# One after the pointer; the HTTPRoutes come from the chat chart. A policy
# whose target route does not exist yet applies and takes effect once the route
# appears. A chat request can wait up to 600 s for the GPU to start plus up to 600 s of generation.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: open-webui-traffic-policy
  namespace: chat
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: open-webui
  timeout:
    http:
      requestTimeout: 1200s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: open-webui-auth-traffic-policy
  namespace: chat
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: open-webui-auth
  # Per Envoy instance, not per client: it slows password guessing, it does not stop it.
  rateLimit:
    type: Local
    local:
      rules:
        - limit:
            requests: 20
            unit: Second
  timeout:
    http:
      requestTimeout: 1200s
{{- end }}
