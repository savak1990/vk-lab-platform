{{- if eq .Values.target "aws" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    # Must outlive the Gateway API resources it manages, and its own chart
    # installs the CRDs they depend on - so it syncs before them, same as
    # a controller-before-CRs split, with no drain urgency to force it lower.
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # OCI chart, same repoURL/chart split karpenter already uses here.
    repoURL: docker.io/envoyproxy
    chart: gateway-helm
    targetRevision: v1.2.1
    helm:
      values: |
        deployment:
          envoyGateway:
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
