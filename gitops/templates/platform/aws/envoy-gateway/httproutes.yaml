{{- if eq .Values.target "aws" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: platform-gateway
      namespace: envoy
  # Matches by hostname. Ahead of automated DNS publishing, reach this via
  # an /etc/hosts entry pointing the hostname at the NLB's address.
  hostnames:
    - "argo.{{ .Values.envoyGateway.fqdn }}"
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: platform-gateway
      namespace: envoy
  hostnames:
    - "grafana.{{ .Values.envoyGateway.fqdn }}"
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
{{- end }}
