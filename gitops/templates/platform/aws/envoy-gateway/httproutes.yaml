{{- if eq .Values.target "aws" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: platform-gateway
      namespace: envoy
  # aws target matches by hostname (spec 010 Req 6). Ahead of ExternalDNS
  # (spec 012, out of scope), reach this via an /etc/hosts entry pointing at
  # the NLB's address for grafana.lab.<root-domain> / argo.lab.<root-domain>.
  hostnames:
    - "argo.lab.<root-domain>"
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: platform-gateway
      namespace: envoy
  hostnames:
    - "grafana.lab.<root-domain>"
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
{{- end }}
