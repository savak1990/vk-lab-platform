{{- if eq .Values.target "aws" }}
# `observability` namespace is guaranteed to exist by this wave (created by
# kube-prometheus-stack.yaml's Application at wave 1).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 24h
  target:
    name: grafana-admin-credentials
    template:
      data:
        admin-user: admin
        admin-password: "{{ "{{ .password }}" }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.project }}-secrets
        property: grafana_admin_password
{{- end }}
