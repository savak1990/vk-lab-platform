{{- if eq .Values.target "aws" }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: lab-postgres
  namespace: cnpg-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: 1
  bootstrap:
    {{- if .Values.postgres.recoverySnapshotHandle }}
    # Recovery bootstrap: rebuild from the VolumeSnapshot imported by
    # recovered-snapshot.yaml (name fixed as lab-postgres-recovered). No
    # fallback to initdb if this fails - see ADR 0013: a loud failure here
    # beats silently wiping a recoverable database.
    # database/owner are what enable CNPG's app-user password reconciler on
    # this path; without them it never re-applies the pinned password to the
    # restored role. Both are no-ops against already-populated PGDATA.
    recovery:
      database: vkdb
      owner: vkdb
      volumeSnapshots:
        storage:
          apiGroup: snapshot.storage.k8s.io
          kind: VolumeSnapshot
          name: lab-postgres-recovered
    {{- else }}
    initdb:
      database: vkdb
      owner: vkdb
    {{- end }}
  storage:
    size: 10Gi
    storageClass: ebs-delete
  # Cold (online: false) volume-snapshot backup - confirmed via CNPG docs
  # to need neither an object store nor WAL archiving, just a CSI driver
  # that supports snapshots. instances: 1 means this briefly fences the
  # primary; acceptable since argo-down.sh triggers it immediately before
  # tearing the cluster down anyway. See ADR 0013.
  backup:
    volumeSnapshot:
      className: ebs-postgres-snapshot
      online: false
  postgresql:
    parameters:
      max_wal_senders: "10"
      max_replication_slots: "10"
      # wal_level intentionally not set — CNPG defaults it to "logical" already
      # shared_buffers / max_connections intentionally not set — no resource
      # requests/limits exist yet to size them against
{{- end }}
