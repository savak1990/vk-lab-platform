{{- if eq .Values.target "aws" }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: postgres-critical
  annotations:
    argocd.argoproj.io/sync-wave: "1"
value: 10000
globalDefault: false
description: Lets Postgres preempt default-priority burst workloads on the shared on-demand pool.
{{- end }}
