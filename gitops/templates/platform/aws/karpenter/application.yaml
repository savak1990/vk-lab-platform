{{- if eq .Values.target "aws" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
  annotations:
    # Lowest wave of anything root manages, so on teardown (reverse-wave)
    # this controller is destroyed last - after the NodePool it must drain,
    # and after every workload whose deletion needs a node to still exist.
    argocd.argoproj.io/sync-wave: "-4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: public.ecr.aws/karpenter
    chart: karpenter
    targetRevision: 1.14.0
    helm:
      values: |
        replicas: 1
        settings:
          clusterName: {{ .Values.project }}-eks
        serviceAccount:
          name: karpenter
        nodeSelector:
          node-type: system
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
{{- end }}
