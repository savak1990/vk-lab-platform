{{- if eq .Values.target "aws" }}
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  role: {{ .Values.project }}-eks-karpenter-node
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.project }}-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.project }}-eks
  tags:
    Project: {{ .Values.project }}
    Scope: platform
    Lifecycle: disposable
    ManagedBy: karpenter
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t4g.medium"] # 2 vCPU, so the cpu limit below is an enforced node count
  limits:
    cpu: "4" # bounds capacity to ~2 nodes at 2 vCPU each
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1m
{{- end }}
