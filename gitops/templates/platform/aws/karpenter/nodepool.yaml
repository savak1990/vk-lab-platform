{{- if eq .Values.target "aws" }}
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
  annotations:
    # Deleting this is what drains the nodes, so it must outlive every other
    # root-managed object - a workload sharing its wave gets its pods evicted
    # mid-deletion, and controllers whose finalizers it needs die with them.
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  role: {{ .Values.project }}-eks-karpenter-node
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.project }}-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.project }}-eks
  tags:
    Project: {{ .Values.project }}
    Scope: platform
    Lifecycle: disposable
    ManagedBy: karpenter
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: spot
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: {{ .Values.karpenter.spot.instanceTypes | toYaml | nindent 12 }}
  limits:
    # Node-count cap, not a vCPU budget - keep in sync with instanceTypes'
    # vCPU count when overriding either value.
    cpu: {{ .Values.karpenter.spot.cpuLimit | quote }}
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1m
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: on-demand
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  template:
    metadata:
      labels:
        workload-type: stateful
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: {{ .Values.karpenter.onDemand.instanceTypes | toYaml | nindent 12 }}
        # Pinned to the same AZ as Kafka's Terraform-owned EBS volume(s) -
        # an EBS volume only attaches within its own AZ, and Postgres shares
        # this pool/AZ too since both are the platform's one stateful zone.
        - key: topology.kubernetes.io/zone
          operator: In
          values: [{{ .Values.karpenter.onDemand.az | quote }}]
      # Only Postgres/Kafka tolerate this - keeps everything else off
      # dedicated, more expensive on-demand capacity by default.
      taints:
        - key: dedicated
          value: stateful
          effect: NoSchedule
  limits:
    cpu: {{ .Values.karpenter.onDemand.cpuLimit | quote }}
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1m
{{- end }}
