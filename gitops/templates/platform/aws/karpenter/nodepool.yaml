{{- if eq .Values.target "aws" }}
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
  annotations:
    # Deleting this is what drains the nodes, so it must outlive every other
    # root-managed object - a workload sharing its wave gets its pods evicted
    # mid-deletion, and controllers whose finalizers it needs die with them.
    argocd.argoproj.io/sync-wave: "-3"
    # Without this, Argo's Application-deletion cascade may prune this object
    # with Kubernetes' Background propagation, which ignores the
    # BlockOwnerDeletion=true Karpenter sets on each NodeClaim's owner
    # reference - letting this object disappear (and the next wave proceed)
    # before every NodeClaim it owns has actually drained and terminated.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,PrunePropagationPolicy=foreground
spec:
  role: {{ .Values.project }}-eks-karpenter-node
  amiSelectorTerms:
    - alias: al2023@latest
  # Matches the vpc-cni prefix-delegation override in terraform/modules/eks -
  # without this, nodeadm calculates max-pods from the pre-prefix-delegation
  # ENI/IP table and the ceiling stays at the old, lower value.
  kubelet:
    maxPods: 110
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.project }}-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.project }}-eks
  tags:
    Project: {{ .Values.project }}
    Scope: platform
    Lifecycle: disposable
    ManagedBy: karpenter
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: spot
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,PrunePropagationPolicy=foreground
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: {{ .Values.karpenter.spot.instanceTypes | toYaml | nindent 12 }}
  limits:
    # Node-count cap, not a vCPU budget - keep in sync with instanceTypes'
    # vCPU count when overriding either value.
    cpu: {{ .Values.karpenter.spot.cpuLimit | quote }}
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1m
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: on-demand
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,PrunePropagationPolicy=foreground
spec:
  template:
    metadata:
      labels:
        workload-type: on-demand
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: {{ .Values.karpenter.onDemand.instanceTypes | toYaml | nindent 12 }}
  limits:
    cpu: {{ .Values.karpenter.onDemand.cpuLimit | quote }}
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1m
{{- end }}
