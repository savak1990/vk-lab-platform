{{- if eq .Values.target "aws" }}
# Syncs the Postgres app-user password from AWS Secrets Manager into a
# Kubernetes Secret (spec 007-2), so CNPG's recovery bootstrap always finds
# the same password the snapshot's PGDATA already has - CNPG never resets
# a role's password on recovery, only at initdb. See ADR 0014.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.9.0
    helm:
      values: |
        serviceAccount:
          name: external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ESO's SecretStore CRDs exceed the 262144-byte last-applied-config
      # annotation limit under client-side apply; SSA needs no such annotation.
      - ServerSideApply=true
{{- end }}
