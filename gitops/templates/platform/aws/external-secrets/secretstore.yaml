{{- if eq .Values.target "aws" }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
      # No auth block: the external-secrets controller pod picks up its
      # Secrets Manager permissions ambiently via EKS Pod Identity
      # (terraform/modules/external-secrets-pod-identity), not IRSA.
---
# cnpg-system must already exist by this wave - it does, created by
# cnpg-operator's own Application (wave -1), same precedent
# recovered-snapshot.yaml already relies on for this namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lab-postgres-app
  namespace: cnpg-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  # No rotation planned for this value - daily polling is enough (ESO
  # defaults to 1h if unset).
  refreshInterval: 24h
  target:
    name: lab-postgres-app
    template:
      type: kubernetes.io/basic-auth
      data:
        username: vkdb
        password: "{{ "{{ .password }}" }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.project }}-secrets
        property: postgres_app_password
{{- end }}
