{{- if eq .Values.target "aws" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://strimzi.io/charts/
    chart: strimzi-kafka-operator
    targetRevision: 1.2.0
    helm:
      values: |
        watchNamespaces:
          - kafka
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  ignoreDifferences:
    # The API server drops this empty schema node (status.clusterSecurity,
    # object type with only x-kubernetes-preserve-unknown-fields: true) on
    # write, so the chart's declared `properties: {}` never round-trips -
    # this is stripped by the API server, not by Argo's diff engine.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: kafkas.kafka.strimzi.io
      jqPathExpressions:
        - '.spec.versions[].schema.openAPIV3Schema.properties.status.properties.clusterSecurity.properties'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ServerSideDiff=true
{{- end }}
