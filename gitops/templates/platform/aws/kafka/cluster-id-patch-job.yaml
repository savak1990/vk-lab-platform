{{- if eq .Values.target "aws" }}
{{- if .Values.kafka.clusterId }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-cluster-id-patcher
  namespace: kafka
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kafka-cluster-id-patcher
  namespace: kafka
rules:
  - apiGroups: ["kafka.strimzi.io"]
    resources: ["kafkas/status"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kafka-cluster-id-patcher
  namespace: kafka
subjects:
  - kind: ServiceAccount
    name: kafka-cluster-id-patcher
    namespace: kafka
roleRef:
  kind: Role
  name: kafka-cluster-id-patcher
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-cluster-id-patch
  namespace: kafka
  annotations:
    # Runs after every sync, not just the first - patching an
    # already-correct value is a no-op (Strimzi's getOrGenerateKRaftClusterId
    # is set-if-empty), and this is the only way a recreated Kafka CR ever
    # gets its cluster ID pinned before brokers reconcile against it.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      serviceAccountName: kafka-cluster-id-patcher
      restartPolicy: Never
      containers:
        - name: patch
          image: registry.k8s.io/kubectl:v1.31.0
          args:
            - patch
            - kafka
            - lab-kafka
            - -n
            - kafka
            - --subresource
            - status
            - --type
            - merge
            - -p
            - '{"status":{"clusterId":"{{ .Values.kafka.clusterId }}"}}'
{{- end }}
{{- end }}
