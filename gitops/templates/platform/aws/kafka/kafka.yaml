{{- if eq .Values.target "aws" }}
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  namespace: kafka
  labels:
    strimzi.io/cluster: lab-kafka
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  replicas: {{ len .Values.kafka.volumes }}
  roles: [controller, broker]
  storage:
    type: persistent-claim
    size: 10Gi
    class: ebs-retain
    # Never destructive - spec 008 Req 5. The PVC/PV above are hand-managed
    # (Terraform-owned volume, ADR 0016); Strimzi must never delete them.
    deleteClaim: false
  # No resources block, matching Postgres's Cluster CR (cnpg-system) -
  # BestEffort QoS, nothing reserved against Karpenter's ~2-node budget.
  # The JVM still has a real baseline memory footprint regardless of QoS
  # class; this only means Kubernetes doesn't pre-reserve capacity for it,
  # not that actual usage drops. Revisit (add requests, at minimum) if this
  # broker is observed getting OOM-killed or evicted under node pressure.
  template:
    pod:
      tolerations:
        - key: dedicated
          operator: Equal
          value: stateful
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload-type
                    operator: In
                    values: ["stateful"]
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: lab-kafka
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.3.1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
  entityOperator:
    topicOperator: {}
    userOperator: {}
{{- end }}
