{{- if eq .Values.target "aws" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ebs-csi-driver
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/aws-ebs-csi-driver
    chart: aws-ebs-csi-driver
    targetRevision: 2.53.0
    helm:
      values: |
        controller:
          serviceAccount:
            create: true
            name: ebs-csi-controller-sa
        # Forced on rather than left to the chart's live-CRD auto-detection
        # (sidecars.snapshotter.forceEnable defaults to false and only
        # activates once it sees the snapshot CRDs already present at
        # render time) - those CRDs are installed by a separate Application
        # in this same rollout, and relying on Argo's sync ordering to win
        # that detection race is fragile. See ADR 0013.
        sidecars:
          snapshotter:
            forceEnable: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
{{- end }}
