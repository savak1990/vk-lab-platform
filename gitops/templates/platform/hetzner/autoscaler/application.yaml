{{- if eq .Values.target "hetzner" }}
{{- $locations := splitList " " (required "capacity.autoscaler.locations is set by argo-up" .Values.capacity.autoscaler.locations) }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-autoscaler
  namespace: argocd
  annotations:
    # Wave 0 puts this after external-secrets (-2) and the operators, and
    # before the observability stack (1) whose pending pods it must serve.
    # Teardown runs waves in reverse, and removal ahead of the workloads leaks
    # nothing: the servers it created are swept by label before destroy.
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/autoscaler
    chart: cluster-autoscaler
    targetRevision: 9.59.0
    helm:
      values: |
        cloudProvider: hetzner
        # The chart's appVersion trails the cluster by a minor, and the
        # autoscaler must match it. This tag and the k3s pin move together;
        # bumping either alone leaves them on different minors.
        image:
          tag: v1.36.1
        # These groups are separate from the fixed pool, so their bounds are
        # deltas: argo-up passes 0 and MAX_WORKER_NODES - MIN_WORKER_NODES.
        # Civo's autoscaler owns the pool it created and takes absolutes.
        autoscalingGroups:
        {{- range $locations }}
          - name: workers-{{ . }}
            minSize: {{ $.Values.capacity.autoscaler.min }}
            maxSize: {{ $.Values.capacity.autoscaler.max }}
            instanceType: {{ $.Values.capacity.autoscaler.nodeType | upper | quote }}
            region: {{ . | upper | quote }}
        {{- end }}
        # One group per location so a stock-out in one is not a stock-out for
        # the cluster; the first location argo-up lists is tried first.
        expanderPriorities:
        {{- range $i, $location := $locations }}
          {{ mul (sub (len $locations) $i) 10 }}:
            - ^workers-{{ $location }}$
        {{- end }}
        # Per key, not envFrom: this Secret's keys are token and network, and
        # envFrom would name the variables after them.
        extraEnvSecrets:
          HCLOUD_TOKEN:
            name: hcloud
            key: token
          HCLOUD_NETWORK:
            name: hcloud
            key: network
        envFromSecret: hcloud-autoscaler-config
        # No HCLOUD_FIREWALL. The provider would attach the firewall to the
        # server at create, adding a resource entry to an apply_to that
        # Terraform owns as a label selector - drift on every later plan. The
        # selector already covers the node: its labels are set at create, and
        # a node placed in the subnet does not boot until after that.
        extraEnv:
          HCLOUD_SSH_KEY: {{ .Values.capacity.autoscaler.sshKeyId | quote }}
          HCLOUD_PUBLIC_IPV4: "true"
          # Matches the fixed nodes: an unused IPv6 still spends primary IP quota.
          HCLOUD_PUBLIC_IPV6: "false"
        extraArgs:
          # Without the first two, every scale-down is blocked: external-dns
          # runs in kube-system with no PodDisruptionBudget, and several
          # platform pods mount emptyDir scratch.
          skip-nodes-with-system-pods: false
          skip-nodes-with-local-storage: false
          scale-down-unneeded-time: 10m
          expander: priority
          # Counts every node, the control plane and the fixed pool included.
          max-nodes-total: {{ required "capacity.autoscaler.maxNodesTotal is set by argo-up" .Values.capacity.autoscaler.maxNodesTotal | quote }}
        podAnnotations:
          # Keeps the autoscaler off a node it is draining.
          cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
{{- end }}
