{{- if and (eq .Values.target "civo") .Values.postgres.backup.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: barman-cloud-plugin
  namespace: argocd
  annotations:
    # After cert-manager (wave 0), whose issuer the plugin needs for its own
    # serving certificate, and before the Cluster that references it.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/cloudnative-pg/charts
    chart: plugin-barman-cloud
    targetRevision: 0.8.0
    helm:
      parameters:
        - name: sidecarImage.registry
          value: {{ .Values.postgres.backup.sidecarImage.registry | quote }}
        - name: sidecarImage.repository
          value: {{ .Values.postgres.backup.sidecarImage.repository | quote }}
        # The chart composes registry/repository:tag, so a bare digest is not
        # expressible; tag@digest is a valid reference and resolves by digest.
        - name: sidecarImage.tag
          value: {{ printf "%s@%s" .Values.postgres.backup.sidecarImage.tag .Values.postgres.backup.sidecarImage.digest | quote }}
      values: |
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    # The plugin only works in the operator's own namespace.
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
