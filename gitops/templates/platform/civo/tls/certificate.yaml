{{- if eq .Values.target "civo" }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-public
  namespace: envoy
  annotations:
    # Wave 2: DNS-01 only needs the wave-0 Gateway and wave-1 identity
    # Certificates, unlike HTTP-01, which also needed application
    # HTTPRoutes and their DNS records.
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # Resolves the HTTPS listener during the very first order, before any
    # real certificate exists yet.
    cert-manager.io/issue-temporary-certificate: "true"
spec:
  secretName: platform-public-tls
  dnsNames:
    - {{ .Values.envoyGateway.fqdn | quote }}
    - {{ printf "*.%s" .Values.envoyGateway.fqdn | quote }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: {{ .Values.tls.issuer | quote }}
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}
