{{- if eq .Values.target "civo" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    # Envoy Gateway (wave -1) supplies the Gateway API CRDs this chart's
    # gatewayAPI.enabled needs present at controller boot - wave 0 is the
    # minimum integer that syncs strictly after it (creation order only).
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.1
    helm:
      values: |
        crds:
          enabled: true
        config:
          gatewayAPI:
            enabled: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        webhook:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        cainjector:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        extraContainers:
          {{- include "platform.rolesAnywhereSidecar" (dict "consumer" "cert-manager" "root" $) | nindent 10 }}
        volumes:
          # optional: true - unlike eso/external-dns, this consumer's own
          # Certificate can only be issued once this controller is running,
          # so the Secret does not exist yet on a fresh make up. The pod
          # starts anyway (sidecar crashloops until the Secret appears),
          # cert-manager's wave-1 Certificate still gets reconciled, and the
          # sidecar recovers on its next restart once kubelet refills the
          # volume.
          - name: ra-cert
            secret:
              secretName: cert-manager-ra-cert
              optional: true
        extraEnv:
          - name: AWS_EC2_METADATA_SERVICE_ENDPOINT
            value: http://127.0.0.1:9911
          - name: AWS_REGION
            value: {{ .Values.region | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
