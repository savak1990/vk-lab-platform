{{- if ne .Values.target "local" }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-parameter-store
  annotations:
    # Wave 2, strictly after the wave-1 workload-identity Certificates: on civo
    # ESO's pod only starts once its Roles Anywhere cert exists, and a wave can
    # never settle while a resource in it waits on a later wave's health.
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ .Values.region }}
      # No auth block: each target supplies its own ambient credentials
      # (EKS Pod Identity on aws, the Roles Anywhere sidecar on civo).
---
# cnpg-system must already exist by this wave - it does, created by
# cnpg-operator's own Application (wave -1), same precedent
# recovered-snapshot.yaml already relies on for this namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lab-postgres-app
  namespace: cnpg-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  # No rotation planned for this value - daily polling is enough (ESO
  # defaults to 1h if unset).
  refreshInterval: 24h
  target:
    name: lab-postgres-app
    template:
      type: kubernetes.io/basic-auth
      data:
        username: vkdb
        password: "{{ "{{ .password }}" }}"
  data:
    - secretKey: password
      remoteRef:
        key: /{{ .Values.project }}/persistent/postgres/app_password
{{- end }}
