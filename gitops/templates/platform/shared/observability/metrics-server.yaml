{{- if and (ne .Values.target "local") (eq (include "platform.metricsServerEnabled" .) "true") }}
# Serves metrics.k8s.io (kubectl top / HPA) - not bundled in kube-prometheus-
# stack, which only brings kube-state-metrics + node-exporter. Argo-managed
# rather than a Terraform EKS addon, matching the ebs-csi-driver precedent.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server
    chart: metrics-server
    targetRevision: 3.14.0
    helm:
      values: |
        # Avoids spot for consistency with the rest of the observability
        # stack's placement policy, though metrics-server itself holds no
        # state and wouldn't be harmed by a spot interruption.
        {{- if eq (include "platform.spotAvoidance" .) "true" }}
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: karpenter.sh/capacity-type
                      operator: NotIn
                      values: ["spot"]
        {{- end }}
        {{- if eq (include "platform.kubeletInsecureTls" .) "true" }}
        # Neither target's kubelet serving certs are verifiable by default -
        # without this, `kubectl top` fails with an x509 error. Accepted
        # lab-scale trade-off, not a security regression worth blocking on.
        args:
          - --kubelet-insecure-tls
        {{- end }}
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
{{- end }}
