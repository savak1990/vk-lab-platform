{{- if ne .Values.target "local" }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: lab-postgres
  namespace: cnpg-system
  annotations:
    # After the wave-2 ExternalSecret: CNPG generates its own lab-postgres-app
    # password Secret if none exists yet, and ESO then collides with it.
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: 1
  imageName: {{ .Values.postgres.imageName | quote }}
  priorityClassName: postgres-critical
  {{- if eq .Values.target "civo" }}
  # CNPG creates a PodDisruptionBudget even for a single instance, and that
  # budget blocks a node from ever draining.
  enablePDB: false
  {{- end }}
  {{- if and (eq .Values.target "aws") .Values.postgres.nodeSelector }}
  affinity:
    nodeSelector:
      {{- .Values.postgres.nodeSelector | toYaml | nindent 6 }}
  {{- end }}
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
  bootstrap:
    {{- if and (eq .Values.target "aws") .Values.postgres.recoverySnapshotHandle }}
    # No initdb fallback: a loud failure beats silently wiping a recoverable
    # database. database/owner enable CNPG's app-user password reconciler on
    # this path - without them the pinned password is never re-applied.
    recovery:
      database: vkdb
      owner: vkdb
      volumeSnapshots:
        storage:
          apiGroup: snapshot.storage.k8s.io
          kind: VolumeSnapshot
          name: lab-postgres-recovered
    {{- else if and .Values.postgres.backup.enabled .Values.postgres.backup.recoverServerName }}
    # Same rule as the snapshot branch above: no initdb fallback on a recovery path.
    recovery:
      database: vkdb
      owner: vkdb
      source: lab-postgres-previous
    {{- else }}
    initdb:
      database: vkdb
      owner: vkdb
    {{- end }}
  {{- if and .Values.postgres.backup.enabled .Values.postgres.backup.recoverServerName (not (and (eq .Values.target "aws") .Values.postgres.recoverySnapshotHandle)) }}
  externalClusters:
    - name: lab-postgres-previous
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: lab-postgres-backups
          serverName: {{ .Values.postgres.backup.recoverServerName | quote }}
  {{- end }}
  storage:
    # Increase-only: shrinking a PVC is rejected by Kubernetes, and on the
    # snapshot-recovery path (above) the new PVC must be >= the snapshot's
    # restore size or it never binds.
    size: {{ .Values.postgres.storageSize | quote }}
    storageClass: {{ include "platform.storageClassName" . }}
  {{- if eq .Values.target "aws" }}
  # Cold (online: false) volume-snapshot backup - confirmed via CNPG docs
  # to need neither an object store nor WAL archiving, just a CSI driver
  # that supports snapshots. instances: 1 means this briefly fences the
  # primary; acceptable since argo-down.sh triggers it immediately before
  # tearing the cluster down anyway. See ADR 0013.
  backup:
    volumeSnapshot:
      className: ebs-postgres-snapshot
      online: false
  {{- end }}
  {{- if and (eq .Values.target "civo") .Values.postgres.backup.enabled }}
  # The backup sidecar has no volumeMounts field of its own; it inherits this
  # container's, which is the only way the certificate reaches it. optional
  # keeps a not-yet-issued certificate from wedging pod creation.
  projectedVolumeTemplate:
    sources:
      - secret:
          name: pgbackup-ra-cert
          optional: true
          items:
            - key: tls.crt
              path: ra/tls.crt
            - key: tls.key
              path: ra/tls.key
      - configMap:
          name: pgbackup-aws-config
          items:
            - key: config
              path: aws/config
  # Set here rather than on the sidecar: this container's env is merged first
  # and wins, and a change here rolls the instance so it is actually applied.
  # Both region names are needed - inheritFromIAMRole returns before barman
  # sets either.
  env:
    - name: AWS_CONFIG_FILE
      value: /projected/aws/config
    - name: AWS_REGION
      value: {{ .Values.region | quote }}
    - name: AWS_DEFAULT_REGION
      value: {{ .Values.region | quote }}
  {{- end }}
  {{- if .Values.postgres.backup.enabled }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: lab-postgres-backups
        # Per bring-up, so a recovered cluster never archives into the prefix
        # it just recovered from and collides with that timeline history.
        serverName: {{ .Values.postgres.backup.serverName | quote }}
  {{- end }}
  postgresql:
    parameters:
      max_wal_senders: "10"
      max_replication_slots: "10"
      # wal_level intentionally not set — CNPG defaults it to "logical" already
      # shared_buffers / max_connections intentionally not set — sized only by
      # the requests above, not by explicit limits
{{- end }}
