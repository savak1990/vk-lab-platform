{{- if ne .Values.target "local" }}
# Namespace for the future vk-llm-on-demand app. Created here, ahead of the
# app itself, the same reasoning as Namespace/ahorro-dev: an ExternalSecret
# apply into a namespace that does not exist yet fails the apply, and
# SkipDryRunOnMissingResource covers only the dry run.
apiVersion: v1
kind: Namespace
metadata:
  name: llm
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vast-ai-api-key
  namespace: llm
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  refreshInterval: 24h
  target:
    name: vast-ai-api-key
  data:
    - secretKey: value
      remoteRef:
        key: /{{ .Values.project }}/persistent/llm/vast_ai_api_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vk-llm-api-token
  namespace: llm
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  refreshInterval: 24h
  target:
    name: vk-llm-api-token
  data:
    - secretKey: value
      remoteRef:
        key: /{{ .Values.project }}/persistent/llm/api_token
{{- end }}
