{{- if ne .Values.target "local" }}
{{- range $i := .Values.vkllm.instances }}
# Namespace for the vk-llm-on-demand app. Created here, ahead of the app
# itself, the same reasoning as Namespace/ahorro-dev: an ExternalSecret
# apply into a namespace that does not exist yet fails the apply, and
# SkipDryRunOnMissingResource covers only the dry run.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $i.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
# The three Secrets below are shaped exactly as the gpu-on-demand chart mounts
# them (its existingSecrets.{provider,apiKeys,ssh}); the chart's own
# ExternalSecrets stay off. Names are the ones the app's gitops/values.yaml
# references.
# client-keys and management-tokens are different values on purpose: the
# server refuses to start if one key appears in both lists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vast-ai-api-key
  namespace: {{ $i.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  refreshInterval: 24h
  target:
    name: vast-ai-api-key
  data:
    - secretKey: VAST_API_KEY
      remoteRef:
        key: /{{ $.Values.project }}/persistent/llm/vast_ai_api_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vk-llm-api-token
  namespace: {{ $i.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  refreshInterval: 24h
  target:
    name: vk-llm-api-token
    # Merge keeps management-tokens and worker-seed: with a template and the
    # default policy ESO writes only the templated keys.
    template:
      mergePolicy: Merge
      data:
        client-keys: |
          {{ "{{ .api_token }}" }}
          {{ "{{ .chat_inference_key }}" }}
  data:
    - secretKey: api_token
      remoteRef:
        key: /{{ $.Values.project }}/persistent/llm/api_token
    - secretKey: chat_inference_key
      remoteRef:
        key: /{{ $.Values.project }}/persistent/chat/inference_key
    - secretKey: management-tokens
      remoteRef:
        key: /{{ $.Values.project }}/persistent/llm/management_tokens
    - secretKey: worker-seed
      remoteRef:
        key: /{{ $.Values.project }}/persistent/llm/worker_seed
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vk-llm-ssh-key
  namespace: {{ $i.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  refreshInterval: 24h
  target:
    name: vk-llm-ssh-key
  data:
    - secretKey: id_ed25519
      remoteRef:
        key: /{{ $.Values.project }}/persistent/llm/ssh_private_key
---
{{- end }}
{{- end }}
