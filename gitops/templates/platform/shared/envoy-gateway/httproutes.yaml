{{- if (eq (include "platform.gatewayEnabled" .) "true") }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
{{- if eq .Values.target "local" }}
  # Matches by path, not hostname: a port-forward to localhost cannot present
  # the Host header hostname matching needs. No hostnames key at all, so any
  # Host matches.
  #
  # Argo CD takes the root prefix because it cannot be served from a subpath
  # here: server.rootpath moves its API and redirects, but the UI keeps
  # <base href="/">, so every relative asset resolves to the root and 404s.
  # server.basehref does not change that tag either - both were measured on a
  # live cluster. Components that do handle a subpath get their own prefix,
  # which Gateway API matches ahead of this one because it is longer.
  parentRefs:
    - name: platform-gateway
      namespace: envoy
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80
{{- else }}
  # https listener only: on civo the http listener carries just the
  # HTTP->HTTPS redirect and the ACME solver routes.
  parentRefs:
    - name: platform-gateway
      namespace: envoy
      sectionName: https
  # Matches by hostname. Ahead of automated DNS publishing, reach this via
  # an /etc/hosts entry pointing the hostname at the NLB's address.
  hostnames:
    - "argo.{{ .Values.envoyGateway.fqdn }}"
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
{{- if eq .Values.target "local" }}
  # Same path-not-hostname reasoning as the route above. The prefix reaches
  # Grafana unrewritten, which is why grafana.ini must set root_url and
  # serve_from_sub_path to match it.
  parentRefs:
    - name: platform-gateway
      namespace: envoy
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /grafana
      backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
{{- else }}
  parentRefs:
    - name: platform-gateway
      namespace: envoy
      sectionName: https
  hostnames:
    - "grafana.{{ .Values.envoyGateway.fqdn }}"
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
{{- end }}
{{- end }}
