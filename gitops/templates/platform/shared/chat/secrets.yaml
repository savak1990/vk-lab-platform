{{- if ne .Values.target "local" }}
# Explicit, not CreateNamespace: an ExternalSecret apply into a missing
# namespace fails, and SkipDryRun covers only the dry run.
apiVersion: v1
kind: Namespace
metadata:
  name: chat
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
# One Secret loaded whole by envFrom; the hex-only db password keeps the URL valid.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-env
  namespace: chat
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  refreshInterval: 24h
  target:
    name: open-webui-env
    template:
      data:
        OPENAI_API_KEY: "{{ "{{ .inference_key }}" }}"
        # One key per Open WebUI connection; the app lists one URL per installation in this order.
        OPENAI_API_KEYS: "{{ range $n, $i := .Values.vkllm.instances }}{{ if $n }};{{ end }}{{ "{{ .inference_key }}" }}{{ end }}"
        WEBUI_SECRET_KEY: "{{ "{{ .webui_secret_key }}" }}"
        WEBUI_ADMIN_EMAIL: "{{ "{{ .admin_email }}" }}"
        WEBUI_ADMIN_PASSWORD: "{{ "{{ .admin_password }}" }}"
        DATABASE_URL: "postgresql://openwebui:{{ "{{ .db_password }}" }}@lab-postgres-rw.cnpg-system:5432/openwebui"
        GOOGLE_CLIENT_ID: "{{ "{{ .google_client_id }}" }}"
        GOOGLE_CLIENT_SECRET: "{{ "{{ .google_client_secret }}" }}"
  data:
    - secretKey: inference_key
      remoteRef:
        key: /{{ .Values.project }}/persistent/chat/inference_key
    - secretKey: webui_secret_key
      remoteRef:
        key: /{{ .Values.project }}/persistent/chat/webui_secret_key
    - secretKey: admin_email
      remoteRef:
        key: /{{ .Values.project }}/persistent/chat/admin_email
    - secretKey: admin_password
      remoteRef:
        key: /{{ .Values.project }}/persistent/chat/admin_password
    - secretKey: db_password
      remoteRef:
        key: /{{ .Values.project }}/persistent/chat/db_password
    - secretKey: google_client_id
      remoteRef:
        key: /{{ .Values.project }}/persistent/chat/google_client_id
    - secretKey: google_client_secret
      remoteRef:
        key: /{{ .Values.project }}/persistent/chat/google_client_secret
{{- end }}
