{{- if ne .Values.target "local" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng
  namespace: chat
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  settings.yml: |
    use_default_settings: true
    server:
      limiter: false
      image_proxy: false
    search:
      formats:
        - html
        - json
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: chat
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
    spec:
      automountServiceAccountToken: false
      containers:
        - name: searxng
          image: docker.io/searxng/searxng:2026.11.23-a7163d091@sha256:a7fc607aa6723f5a8982105bcc5ffba4d1b9fc7c6922a31a88d6e4cba49ef12a
          ports:
            - name: http
              containerPort: 8080
          env:
            # One worker is enough for a household; the image default of 5 idles near 500 MiB.
            - name: GRANIAN_WORKERS
              value: "1"
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: open-webui-env
                  key: WEBUI_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
      volumes:
        - name: settings
          configMap:
            name: searxng
---
# ClusterIP only: no HTTPRoute ever points here.
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: chat
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    app.kubernetes.io/name: searxng
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
