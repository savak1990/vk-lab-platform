{{- if ne .Values.target "local" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-webui
  namespace: argocd
  annotations:
    # After the chat secrets (2) and the openwebui database (4), beside
    # SearXNG and the other app pointers, so nothing platform-level waits on it.
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://helm.openwebui.com/
    chart: open-webui
    targetRevision: 18.4.0
    helm:
      values: |
        ollama:
          enabled: false
        pipelines:
          enabled: false
        tika:
          enabled: false
        # In-memory websocket manager: one replica needs no Redis.
        websocket:
          enabled: true
          manager: ""
          redis:
            enabled: false
        persistence:
          enabled: false
        # One replica, one database: an upgrade must never run two pods
        # against the same migrations.
        strategy:
          type: Recreate
        readinessProbe:
          httpGet:
            path: /health
            port: http
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 30
        image:
          tag: v0.13.4-slim
        resources:
          requests:
            cpu: 25m
            memory: 256Mi
          limits:
            memory: 768Mi
        logging:
          level: info
        enableOpenaiApi: true
        openaiBaseApiUrl: http://gpu-on-demand.llm.svc/v1
        openaiApiKeyExistingSecret: open-webui-env
        openaiApiKeyExistingSecretKey: OPENAI_API_KEY
        extraEnvFrom:
          - secretRef:
              name: open-webui-env
        extraEnvVars:
          - name: WEBUI_URL
            value: "https://chat.{{ .Values.envoyGateway.fqdn }}"
          - name: ENABLE_PERSISTENT_CONFIG
            value: "false"
          - name: ENABLE_SIGNUP
            value: "false"
          - name: DEFAULT_MODELS
            value: qwen3.8-27b
          - name: TASK_MODEL_EXTERNAL
            value: qwen3.8-27b
          - name: ENABLE_TITLE_GENERATION
            value: "true"
          - name: ENABLE_SEARCH_QUERY_GENERATION
            value: "true"
          - name: ENABLE_TAGS_GENERATION
            value: "false"
          - name: ENABLE_FOLLOW_UP_GENERATION
            value: "false"
          - name: ENABLE_AUTOCOMPLETE_GENERATION
            value: "false"
          - name: ENABLE_WEB_SEARCH
            value: "true"
          - name: WEB_SEARCH_ENGINE
            value: searxng
          - name: SEARXNG_QUERY_URL
            value: "http://searxng.chat.svc:8080/search?q=<query>"
          - name: WEB_SEARCH_RESULT_COUNT
            value: "3"
          - name: BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL
            value: "true"
          - name: RAG_EMBEDDING_ENGINE
            value: openai
          - name: USER_PERMISSIONS_CHAT_FILE_UPLOAD
            value: "false"
          - name: ENABLE_API_KEYS
            value: "false"
          - name: USER_PERMISSIONS_FEATURES_API_KEYS
            value: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: chat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
{{- end }}
