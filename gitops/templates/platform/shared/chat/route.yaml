{{- if ne .Values.target "local" }}
# One after the Application, which creates the Service these target;
# a route whose backend is missing yet reports Degraded and would stall the sync.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui
  namespace: chat
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: platform-gateway
      namespace: envoy
      sectionName: https
  hostnames:
    - "chat.{{ .Values.envoyGateway.fqdn }}"
  rules:
    - backendRefs:
        - name: open-webui
          port: 80
---
# All /api/v1/auths/* endpoints. The longer prefix wins over the main route,
# so a cold page load (dozens of parallel assets) never meets the rate limit.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui-auth
  namespace: chat
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: platform-gateway
      namespace: envoy
      sectionName: https
  hostnames:
    - "chat.{{ .Values.envoyGateway.fqdn }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/auths/
      backendRefs:
        - name: open-webui
          port: 80
---
# The gateway's generation timeout (600 s) plus 60 s, like the GPU route.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: open-webui-traffic-policy
  namespace: chat
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: open-webui
  timeout:
    http:
      requestTimeout: 660s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: open-webui-auth-traffic-policy
  namespace: chat
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: open-webui-auth
  # Per Envoy instance, not per client: it slows password guessing, it does not stop it.
  rateLimit:
    type: Local
    local:
      rules:
        - limit:
            requests: 20
            unit: Second
  timeout:
    http:
      requestTimeout: 660s
{{- end }}
