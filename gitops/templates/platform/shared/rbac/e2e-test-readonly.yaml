# Read-only access for the E2E suite (tests/e2e), never cluster-admin. One
# ClusterRole bound per namespace: a namespace grants nothing for a kind it
# has none of, so the minor over-grant costs nothing real.
{{- if (eq (include "platform.selfManaged" .) "true") }}
apiVersion: v1
kind: Namespace
metadata:
  name: e2e
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: e2e-test
  namespace: e2e
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: e2e-test-readonly
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "secrets", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2e-test-readonly
  namespace: cnpg-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
subjects:
  {{- include "platform.e2eTestSubject" . | nindent 2 }}
roleRef:
  kind: ClusterRole
  name: e2e-test-readonly
  apiGroup: rbac.authorization.k8s.io
---
{{- if ne .Values.target "local" }}
# Stays gated: the observability namespace only exists once
# kube-prometheus-stack's Application creates it.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2e-test-readonly
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
subjects:
  {{- include "platform.e2eTestSubject" . | nindent 2 }}
roleRef:
  kind: ClusterRole
  name: e2e-test-readonly
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2e-test-readonly
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
subjects:
  {{- include "platform.e2eTestSubject" . | nindent 2 }}
roleRef:
  kind: ClusterRole
  name: e2e-test-readonly
  apiGroup: rbac.authorization.k8s.io
