# Read-only access for the E2E suite (tests/e2e), never cluster-admin. One
# ClusterRole bound per namespace: a namespace grants nothing for a kind it
# has none of, so the minor over-grant costs nothing real.
{{- if (eq (include "platform.e2eTestUsesServiceAccount" .) "true") }}
apiVersion: v1
kind: Namespace
metadata:
  name: e2e
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: e2e-test
  namespace: e2e
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: e2e-test-readonly
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "secrets", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2e-test-readonly
  namespace: cnpg-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
subjects:
  {{- include "platform.e2eTestSubject" . | nindent 2 }}
roleRef:
  kind: ClusterRole
  name: e2e-test-readonly
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2e-test-readonly
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
subjects:
  {{- include "platform.e2eTestSubject" . | nindent 2 }}
roleRef:
  kind: ClusterRole
  name: e2e-test-readonly
  apiGroup: rbac.authorization.k8s.io
{{- if eq .Values.target "local" }}
---
# Only this target reaches the gateway through a port-forward, and
# pods/portforward is granted per namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2e-test-readonly
  namespace: envoy
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
subjects:
  {{- include "platform.e2eTestSubject" . | nindent 2 }}
roleRef:
  kind: ClusterRole
  name: e2e-test-readonly
  apiGroup: rbac.authorization.k8s.io
---
# Ahorro publishes no route on this target, so its checks port-forward the two
# Services directly. Created here rather than left to the children's
# CreateNamespace: those arrive at wave 5, and a RoleBinding whose namespace
# does not exist fails the apply, which SkipDryRunOnMissingResource does not
# cover. CreateNamespace is idempotent and tracks nothing, so nothing is
# owned twice.
apiVersion: v1
kind: Namespace
metadata:
  name: ahorro
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2e-test-readonly
  namespace: ahorro
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
subjects:
  {{- include "platform.e2eTestSubject" . | nindent 2 }}
roleRef:
  kind: ClusterRole
  name: e2e-test-readonly
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2e-test-readonly
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
subjects:
  {{- include "platform.e2eTestSubject" . | nindent 2 }}
roleRef:
  kind: ClusterRole
  name: e2e-test-readonly
  apiGroup: rbac.authorization.k8s.io
