{{- range $cred := .Values.deployCredentials }}
{{- $home := first $cred.namespaces }}
{{- range $ns := $cred.namespaces }}
---
# Created here, not by `helm --create-namespace`: a RoleBinding whose
# namespace does not exist fails the apply.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $cred.app }}-deploy
  namespace: {{ $home }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
{{- range $ns := $cred.namespaces }}
---
# A Role per namespace, never a ClusterRole: a ClusterRole could be bound
# into the Argo-owned namespace by accident.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $cred.app }}-deploy
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
rules:
  {{- toYaml $cred.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $cred.app }}-deploy
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
subjects:
  - kind: ServiceAccount
    name: {{ $cred.app }}-deploy
    namespace: {{ $home }}
roleRef:
  kind: Role
  name: {{ $cred.app }}-deploy
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
# Namespace read lets `helm upgrade` report a clear error instead of a
# permission failure.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $cred.app }}-deploy-namespace-read
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $cred.app }}-deploy-namespace-read
  annotations:
    argocd.argoproj.io/sync-wave: "2"
subjects:
  - kind: ServiceAccount
    name: {{ $cred.app }}-deploy
    namespace: {{ $home }}
roleRef:
  kind: ClusterRole
  name: {{ $cred.app }}-deploy-namespace-read
  apiGroup: rbac.authorization.k8s.io
{{- end }}
