# Overridden per install: `aws` (Terraform, spec 004) sets repoURL/targetRevision
# to this GitHub repo; `local` (spec 021's script) sets them to a local source.
target: aws
project: vk-lab-platform
repoURL: https://github.com/savak1990/vk-lab-platform
targetRevision: main

# Set automatically by scripts/argo-up.sh, which discovers the latest
# retained EBS snapshot (if any) via the AWS API - no manual edit
# required. Empty means "no snapshot found, bootstrap fresh". See ADR 0013.
postgres:
  recoverySnapshotHandle: ""
