# Overridden per install: `aws` (Terraform, spec 004) sets repoURL/targetRevision
# to this GitHub repo; `local` (spec 021's script) sets them to a local source.
target: aws
project: vk-lab-platform
vpcId: ""
repoURL: https://github.com/savak1990/vk-lab-platform
targetRevision: main

# storageSize/karpenter below are operator-configurable via env vars on
# scripts/argo-up.sh - defaults here match gitops/values.yaml.
postgres:
  storageSize: 10Gi
  backup:
    enabled: false
    bucket: ""
    serverName: ""
    recoverServerName: ""

karpenter:
  spot:
    instanceTypes:
      ["t4g.medium", "t4g.large", "m6g.medium", "m6g.large", "m7g.medium", "m7g.large"]
    cpuLimit: "4"
  onDemand:
    instanceTypes:
      ["t4g.medium", "t4g.large", "m6g.medium", "m6g.large", "m7g.medium", "m7g.large"]
    cpuLimit: "4"

# civo-only; must match gitops/values.yaml's capacity.autoscaler block.
capacity:
  autoscaler:
    min: 3
    max: 4
    pool: workers

envoyGateway:
  acmCertificateArn: ""
  nlbSubnetIds: ""
  fqdn: ""
  reservedIp: ""
  firewallId: ""

externalDns:
  txtOwnerId: ""

# civo-only; must match gitops/values.yaml's tls block.
tls:
  issuer: "letsencrypt-prod"
  acmeEmail: ""
  hostedZoneId: ""

awsIdentity:
  rolesAnywhere:
    trustAnchorArn: ""
    profileArn: ""
    roleArns:
      eso: ""
      external-dns: ""
      cert-manager: ""
      pgbackup: ""
