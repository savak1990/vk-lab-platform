apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  annotations:
    # Without this, Argo diffs the raw git manifest against the live object's
    # server-defaulted fields (e.g. HTTPRoute's default path match) and reports
    # permanent false-positive drift. It is a compare option, not a sync one -
    # an unknown string in syncOptions is silently ignored.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: gitops
    helm:
      parameters:
        - name: target
          value: {{ .Values.target | quote }}
        - name: project
          value: {{ .Values.project | quote }}
        - name: vpcId
          value: {{ .Values.vpcId | quote }}
        - name: postgres.storageSize
          value: {{ .Values.postgres.storageSize | quote }}
        - name: karpenter.spot.cpuLimit
          value: {{ .Values.karpenter.spot.cpuLimit | quote }}
        - name: karpenter.onDemand.cpuLimit
          value: {{ .Values.karpenter.onDemand.cpuLimit | quote }}
        - name: envoyGateway.acmCertificateArn
          value: {{ .Values.envoyGateway.acmCertificateArn | quote }}
        - name: envoyGateway.nlbSubnetIds
          value: {{ .Values.envoyGateway.nlbSubnetIds | quote }}
        - name: envoyGateway.fqdn
          value: {{ .Values.envoyGateway.fqdn | quote }}
        - name: envoyGateway.reservedIp
          value: {{ .Values.envoyGateway.reservedIp | quote }}
        - name: envoyGateway.firewallId
          value: {{ .Values.envoyGateway.firewallId | quote }}
        - name: externalDns.txtOwnerId
          value: {{ .Values.externalDns.txtOwnerId | quote }}
        - name: tls.issuer
          value: {{ .Values.tls.issuer | quote }}
        - name: tls.acmeEmail
          value: {{ .Values.tls.acmeEmail | quote }}
        - name: tls.hostedZoneId
          value: {{ .Values.tls.hostedZoneId | quote }}
        - name: awsIdentity.rolesAnywhere.trustAnchorArn
          value: {{ .Values.awsIdentity.rolesAnywhere.trustAnchorArn | quote }}
        - name: awsIdentity.rolesAnywhere.profileArn
          value: {{ .Values.awsIdentity.rolesAnywhere.profileArn | quote }}
        - name: awsIdentity.rolesAnywhere.roleArns.eso
          value: {{ .Values.awsIdentity.rolesAnywhere.roleArns.eso | quote }}
        - name: awsIdentity.rolesAnywhere.roleArns.external-dns
          value: {{ index .Values.awsIdentity.rolesAnywhere.roleArns "external-dns" | quote }}
        - name: awsIdentity.rolesAnywhere.roleArns.cert-manager
          value: {{ index .Values.awsIdentity.rolesAnywhere.roleArns "cert-manager" | quote }}
        - name: awsIdentity.rolesAnywhere.roleArns.pgbackup
          value: {{ .Values.awsIdentity.rolesAnywhere.roleArns.pgbackup | quote }}
        - name: postgres.backup.enabled
          value: {{ .Values.postgres.backup.enabled | quote }}
        - name: postgres.backup.bucket
          value: {{ .Values.postgres.backup.bucket | quote }}
        - name: postgres.backup.serverName
          value: {{ .Values.postgres.backup.serverName | quote }}
        - name: postgres.backup.recoverServerName
          value: {{ .Values.postgres.backup.recoverServerName | quote }}
      # karpenter.{spot,onDemand}.instanceTypes are lists - `parameters`
      # only carries scalar string overrides (Argo CD's own documented
      # limitation), so these go through valuesObject instead, which Argo
      # merges as a real Helm values override, not a stringified `--set`.
      valuesObject:
        karpenter:
          spot:
            instanceTypes: {{ .Values.karpenter.spot.instanceTypes | toYaml | nindent 14 }}
          onDemand:
            instanceTypes: {{ .Values.karpenter.onDemand.instanceTypes | toYaml | nindent 14 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # A failed automated sync is never re-attempted for the same revision, so a
    # sibling Application's CRDs or namespace arriving late wedges root forever.
    # The budget outlasts Argo's own API-discovery cache refresh, not just the CRD.
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 2m
    syncOptions:
      - ServerSideApply=true
