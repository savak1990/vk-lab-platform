apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: gitops
    helm:
      parameters:
        - name: target
          value: {{ .Values.target | quote }}
        - name: project
          value: {{ .Values.project | quote }}
        - name: region
          value: {{ .Values.region | quote }}
        - name: vpcId
          value: {{ .Values.vpcId | quote }}
        - name: postgres.recoverySnapshotHandle
          value: {{ .Values.postgres.recoverySnapshotHandle | quote }}
        - name: postgres.storageSize
          value: {{ .Values.postgres.storageSize | quote }}
        - name: karpenter.spot.cpuLimit
          value: {{ .Values.karpenter.spot.cpuLimit | quote }}
        - name: karpenter.onDemand.cpuLimit
          value: {{ .Values.karpenter.onDemand.cpuLimit | quote }}
        - name: envoyGateway.acmCertificateArn
          value: {{ .Values.envoyGateway.acmCertificateArn | quote }}
        - name: envoyGateway.nlbSubnetIds
          value: {{ .Values.envoyGateway.nlbSubnetIds | quote }}
        - name: envoyGateway.fqdn
          value: {{ .Values.envoyGateway.fqdn | quote }}
      # karpenter.{spot,onDemand}.instanceTypes are lists - `parameters`
      # only carries scalar string overrides (Argo CD's own documented
      # limitation), so these go through valuesObject instead, which Argo
      # merges as a real Helm values override, not a stringified `--set`.
      valuesObject:
        karpenter:
          spot:
            instanceTypes: {{ .Values.karpenter.spot.instanceTypes | toYaml | nindent 14 }}
          onDemand:
            instanceTypes: {{ .Values.karpenter.onDemand.instanceTypes | toYaml | nindent 14 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  ignoreDifferences:
    # snapshot-controller patches the bound snapshot's uid in here, but the
    # field is atomic - any re-apply replaces the whole object and drops it,
    # leaving the CSI provisioner stuck on "snapshot not bound" forever.
    - group: snapshot.storage.k8s.io
      kind: VolumeSnapshotContent
      jsonPointers:
        - /spec/volumeSnapshotRef
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      # Without this, Argo diffs the raw git manifest against the live
      # object's server-defaulted fields (e.g. HTTPRoute's default path
      # match) and reports permanent false-positive drift.
      - ServerSideDiff=true
