apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: gitops
    helm:
      parameters:
        - name: target
          value: {{ .Values.target | quote }}
        - name: project
          value: {{ .Values.project | quote }}
        - name: region
          value: {{ .Values.region | quote }}
        - name: postgres.recoverySnapshotHandle
          value: {{ .Values.postgres.recoverySnapshotHandle | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
