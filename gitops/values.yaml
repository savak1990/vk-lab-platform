# Set by the root Application's helm parameters (gitops/bootstrap): target
# gates AWS-only child Applications, project matches the AWS resource names
# Terraform created under PROJECT_NAME (default: vk-lab-platform).
target: aws
project: vk-lab-platform
# Fixed, not an operator knob - the two AWS controllers below need a literal.
region: eu-west-1
# Set by scripts/argo-up.sh from the eks Terraform unit's vpc_id output -
# lets aws-load-balancer-controller skip IMDS-based VPC discovery.
vpcId: ""

# className names the CSI StorageClass a target provides; each target
# supplies its own.
storage:
  className: ebs-delete

# spotAvoidance gates the observability/Postgres anti-affinity blocks below —
# only meaningful where Karpenter's spot/on-demand distinction exists (aws).
capacity:
  spotAvoidance: true
  # min/max/pool are civo-only. The pool name "workers" is special to the civo
  # cloud provider - it applies min/max to every pool in the cluster, which is
  # correct here because there is one. hetzner states its own bounds in its
  # Application: a ceiling of four is that target's account limit, not an input.
  # The three below are hetzner-only, from the operator inputs and SSM.
  autoscaler:
    min: 3
    max: 4
    pool: workers
    nodeType: ""
    location: ""
    sshKeyId: ""

# aws's current defaults; civo overrides both through the
# platform.kubeletInsecureTls/platform.metricsServerEnabled helpers instead.
observability:
  kubeletInsecureTls: true
  metricsServer:
    enabled: true
  # Retention windows and volume sizes. local is sized for one working
  # session, not a day - the cluster is deleted whole, so nothing outlives
  # it. Resource requests stay out of here on purpose: they are measured,
  # and a request below real usage buys eviction, not headroom.
  profile:
    default:
      prometheusRetention: 7d
      prometheusRetentionSize: "8GB"
      prometheusStorage: 10Gi
      alertmanagerStorage: 1Gi
      lokiRetention: 168h
      lokiStorage: 10Gi
    local:
      prometheusRetention: 6h
      # Held below the claim so the head block and the WAL still fit.
      prometheusRetentionSize: "500MB"
      prometheusStorage: 1Gi
      # Unused here - alertmanager is disabled on this target.
      alertmanagerStorage: 256Mi
      # Only retention. Loki's reject_old_samples_max_age stays at 168h on
      # every target: it bounds how stale an arriving line may be, so tying
      # it to this would drop real logs after a laptop suspend.
      lokiRetention: 6h
      lokiStorage: 1Gi

# podIdentity (EKS Pod Identity) is aws-only; other targets substitute
# their own workload-identity mechanism.
awsIdentity:
  mode: podIdentity
  # civo-only. The five ARN-shaped fields below don't exist until a real
  # bootstrap-up creates them, and are populated at argo-up runtime via --set.
  rolesAnywhere:
    image: "public.ecr.aws/rolesanywhere/credential-helper@sha256:56b03f3acba0bda06c94189ab62c4a497fd1912f3d08311fb99ab24e4e4c2f84"
    trustAnchorArn: ""
    profileArn: ""
    roleArns:
      eso: ""
      external-dns: ""
      cert-manager: ""
      pgbackup: ""

# storageSize is operator-configurable (KARPENTER_INSTANCE_TYPES sibling:
# POSTGRES_STORAGE_SIZE env var on argo-up.sh) — increase-only, see
# scripts/argo-up.sh usage comment for why.
#
# The local target takes this same single instance at 250m/256Mi, on kind's
# own storage class, with backups off and its data throwaway. Only the volume
# is smaller there: argo-up defaults it to 5Gi rather than the 20Gi below.
postgres:
  storageSize: 20Gi
  # Pinned so an operator chart upgrade never changes the major version under
  # existing data. Multi-arch: arm64 on aws, amd64 on civo.
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie@sha256:42708a75345b7a48fdd9257b071830783a97fd228529196b6313187a7198e185"
  # enabled/bucket/serverName/recoverServerName are set by scripts/argo-up.sh
  # at install time; serverName is minted per bring-up and recoverServerName
  # names the previous one, or is empty on a first run.
  # retention is a recovery window, not a backup count - the field accepts no
  # other form, so a daily schedule with "2d" keeps roughly two base backups.
  backup:
    enabled: false
    bucket: ""
    serverName: ""
    recoverServerName: ""
    schedule: "0 0 3 * * *"
    retention: "2d"
    # aws gets credentials from Pod Identity and runs the upstream multi-arch
    # sidecar. The self-managed targets reach AWS through Roles Anywhere, which
    # needs aws_signing_helper in the image, so they share one build - aliased
    # rather than copied, because a duplicated digest drifts on the next bump.
    sidecarImages:
      aws:
        registry: ghcr.io
        repository: cloudnative-pg/plugin-barman-cloud-sidecar
        tag: v0.15.0
        digest: sha256:06c78deca670525daa35fb1e5323159092785d11cf87b86217bdd5c679a41a84
      civo: &rolesAnywhereSidecar
        registry: ghcr.io
        repository: savak1990/vk-lab-platform/cnpg-barman-sidecar
        tag: d4e116cf91f4db0e39da7785c469a295cd1798f7
        digest: sha256:25332843178ff9560b176f7c6c22006c1b361cb249bae7f52728d733f7d98cda
      hetzner: *rolesAnywhereSidecar
  # Pins Postgres off spot (AZ-pinned PVC + interruption risk). aws-only:
  # Helm deep-merges values, so the shared Cluster template gates this on
  # target rather than relying on a per-target override.
  nodeSelector:
    workload-type: on-demand

# Operator-configurable via {SPOT,ON_DEMAND}_KARPENTER_INSTANCE_TYPES
# (comma-separated) and {SPOT,ON_DEMAND}_KARPENTER_CPU_LIMIT env vars on
# scripts/argo-up.sh. cpuLimit must be kept in sync with instanceTypes'
# vCPU count and the desired max node count — it is not derived
# automatically. onDemand nodes carry workload-type: on-demand (matched by
# Postgres's nodeSelector) — not exclusive to Postgres, just steadier
# capacity than spot; other components avoid spot via anti-affinity instead
# of being excluded from on-demand by a taint. Both pools
# list several arm64 families/sizes (not just one) so Karpenter has a
# fallback when a single instance type/AZ combination has no capacity —
# Karpenter still prefers the cheapest instance type that fits a pod's
# actual requests, so listing more options doesn't mean pricier nodes.
karpenter:
  spot:
    instanceTypes:
      ["t4g.medium", "t4g.large", "m6g.medium", "m6g.large", "m7g.medium", "m7g.large"]
    cpuLimit: "4"
  onDemand:
    instanceTypes:
      ["t4g.medium", "t4g.large", "m6g.medium", "m6g.large", "m7g.medium", "m7g.large"]
    cpuLimit: "4"

# Set by scripts/argo-up.sh: acmCertificateArn from bootstrap/acm's
# certificate_arn output, nlbSubnetIds from the eks unit's node_subnet_id -
# kept explicit as a fast-follow even though spec 020's VPC subnets already
# carry kubernetes.io/role/elb (see envoy-gateway/gateway.yaml's comment).
# fqdn is persistent/route53's fqdn output ("lab.<root-domain>") - the
# HTTPRoutes' hostnames are built from this, not a literal domain string.
# reservedIp/firewallId are Civo-target equivalents of acmCertificateArn/
# nlbSubnetIds - Terraform-derived values the Civo Gateway LB needs.
# location is the Hetzner one: the hcloud location the load balancer is
# created in, from the REGION operator input rather than from Terraform.
envoyGateway:
  acmCertificateArn: ""
  nlbSubnetIds: ""
  reservedIp: ""
  firewallId: ""
  location: ""
  fqdn: ""

# txtOwnerId is external-dns's TXT-registry ownership marker - stable across
# make down/up cycles. Empty means "use .Values.project" (aws's current
# behavior); a target may pass its own project-scoped id instead.
externalDns:
  txtOwnerId: ""

# civo-only: which cert-manager ClusterIssuer the public Certificate uses.
# prod is the personal-lab default. CI must pass TLS_ISSUER=letsencrypt-staging
# on its make step: a fresh project per run means a new order every run, and
# prod's duplicate-certificate limit is shared with the personal lab (CIVO-140).
tls:
  issuer: "letsencrypt-prod"
  acmeEmail: ""
  # civo-only: the Civo zone's Route53 zone ID, read from
  # /${project}/bootstrap/route53/zone_id - lets the dns01.route53 solver
  # skip route53:ListHostedZones entirely.
  hostedZoneId: ""

# Self-managed targets only: each name/namespace here must match a Roles
# Anywhere trust-policy key in terraform/modules/rolesanywhere - name also
# becomes the commonName/secretName suffix.
workloadIdentity:
  # Empty derives "<target>-workload-ca", matching the trust anchor name.
  issuerName: ""
  consumers:
    - name: eso
      namespace: external-secrets
    - name: external-dns
      namespace: kube-system
    - name: cert-manager
      namespace: cert-manager
    - name: pgbackup
      namespace: cnpg-system
