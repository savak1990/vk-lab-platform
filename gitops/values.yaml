# Set by the root Application's helm parameters (gitops/bootstrap): target
# gates AWS-only child Applications, project matches the AWS resource names
# Terraform created under PROJECT_NAME (default vk-lab-platform).
target: aws
project: vk-lab-platform
# Fixed, not an operator knob - the two AWS controllers below need a literal.
region: eu-west-1
# Set by scripts/argo-up.sh from the eks Terraform unit's vpc_id output -
# lets aws-load-balancer-controller skip IMDS-based VPC discovery.
vpcId: ""

# className/snapshotClassName name the CSI StorageClass/VolumeSnapshotClass
# a target provides; each target supplies its own.
storage:
  className: ebs-delete
  snapshotClassName: ebs-postgres-snapshot

# spotAvoidance gates the observability/Postgres anti-affinity blocks below —
# only meaningful where Karpenter's spot/on-demand distinction exists (aws).
capacity:
  spotAvoidance: true

# podIdentity (EKS Pod Identity) is aws-only; other targets substitute
# their own workload-identity mechanism.
awsIdentity:
  mode: podIdentity
  # civo-only. The four ARN-shaped fields below don't exist until a real
  # bootstrap-up creates them, and are populated at argo-up runtime via --set.
  rolesAnywhere:
    image: "public.ecr.aws/rolesanywhere/credential-helper@sha256:56b03f3acba0bda06c94189ab62c4a497fd1912f3d08311fb99ab24e4e4c2f84"
    trustAnchorArn: ""
    profileArn: ""
    roleArns:
      eso: ""
      external-dns: ""

# recoverySnapshotHandle is set automatically by scripts/argo-up.sh, which
# discovers the latest retained EBS snapshot (if any) via the AWS API — no
# manual edit required. Empty means "no snapshot found, bootstrap fresh".
# See ADR 0013. storageSize is operator-configurable (KARPENTER_INSTANCE_TYPES
# sibling: POSTGRES_STORAGE_SIZE env var on argo-up.sh) — increase-only, see
# scripts/argo-up.sh usage comment for why.
postgres:
  recoverySnapshotHandle: ""
  storageSize: 20Gi
  # Pins Postgres off spot (AZ-pinned PVC + interruption risk). Helm deep-
  # merges values, so a target without an on-demand pool needs its own
  # postgres/cluster.yaml (or a nodeSelector: null override), not {}.
  nodeSelector:
    workload-type: on-demand

# Operator-configurable via {SPOT,ON_DEMAND}_KARPENTER_INSTANCE_TYPES
# (comma-separated) and {SPOT,ON_DEMAND}_KARPENTER_CPU_LIMIT env vars on
# scripts/argo-up.sh. cpuLimit must be kept in sync with instanceTypes'
# vCPU count and the desired max node count — it is not derived
# automatically. onDemand nodes carry workload-type: on-demand (matched by
# Postgres's nodeSelector) — not exclusive to Postgres, just steadier
# capacity than spot; other components avoid spot via anti-affinity instead
# of being excluded from on-demand by a taint. Both pools
# list several arm64 families/sizes (not just one) so Karpenter has a
# fallback when a single instance type/AZ combination has no capacity —
# Karpenter still prefers the cheapest instance type that fits a pod's
# actual requests, so listing more options doesn't mean pricier nodes.
karpenter:
  spot:
    instanceTypes:
      ["t4g.medium", "t4g.large", "m6g.medium", "m6g.large", "m7g.medium", "m7g.large"]
    cpuLimit: "4"
  onDemand:
    instanceTypes:
      ["t4g.medium", "t4g.large", "m6g.medium", "m6g.large", "m7g.medium", "m7g.large"]
    cpuLimit: "4"

# Set by scripts/argo-up.sh: acmCertificateArn from persistent/acm's
# certificate_arn output, nlbSubnetIds from the eks unit's node_subnet_id -
# kept explicit as a fast-follow even though spec 020's VPC subnets already
# carry kubernetes.io/role/elb (see envoy-gateway/gateway.yaml's comment).
# fqdn is persistent/route53's fqdn output ("lab.<root-domain>") - the
# HTTPRoutes' hostnames are built from this, not a literal domain string.
# reservedIp/firewallId are Civo-target equivalents of acmCertificateArn/
# nlbSubnetIds - Terraform-derived values the Civo Gateway LB needs.
envoyGateway:
  acmCertificateArn: ""
  nlbSubnetIds: ""
  reservedIp: ""
  firewallId: ""
  fqdn: ""

# txtOwnerId is external-dns's TXT-registry ownership marker - stable across
# make down/up cycles. Empty means "use .Values.project" (aws's current
# behavior); a target may pass its own project-scoped id instead.
externalDns:
  txtOwnerId: ""

# civo-only: which cert-manager ClusterIssuer the public Certificate uses.
# Staging avoids Let's Encrypt's real rate limits during automated/CI runs;
# prod is switched on explicitly for the real personal lab. acmeEmail is
# not a secret (Let's Encrypt account contact only).
tls:
  issuer: "letsencrypt-staging"
  acmeEmail: ""

# civo-only: each name/namespace here must match a Roles Anywhere trust-policy
# key in terraform/modules/rolesanywhere - name also becomes the
# commonName/secretName suffix.
civoIdentity:
  consumers:
    - name: eso
      namespace: external-secrets
    - name: external-dns
      namespace: kube-system
