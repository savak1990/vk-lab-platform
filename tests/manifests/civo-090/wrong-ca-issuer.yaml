apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: civo-090-selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: civo-090-wrong-ca-eso
  namespace: external-secrets
spec:
  commonName: "vk-civo-lab-civo-eso"
  subject:
    organizations: ["vk-civo-lab"]
  usages: ["digital signature"]
  isCA: false
  duration: 24h
  renewBefore: 8h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  secretName: wrong-ca-eso-cert
  issuerRef:
    name: civo-090-selfsigned-issuer
    kind: ClusterIssuer
