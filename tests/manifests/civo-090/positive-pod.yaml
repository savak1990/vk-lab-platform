apiVersion: v1
kind: Pod
metadata:
  name: civo-090-positive
  namespace: external-secrets
spec:
  containers:
    - name: aws-cli
      image: amazon/aws-cli:latest
      command: ["sleep", "infinity"]
      env:
        - name: AWS_EC2_METADATA_SERVICE_ENDPOINT
          value: http://127.0.0.1:9911
        - name: AWS_REGION
          value: eu-west-1
    - name: aws-signing-helper
      image: "public.ecr.aws/rolesanywhere/credential-helper@sha256:56b03f3acba0bda06c94189ab62c4a497fd1912f3d08311fb99ab24e4e4c2f84"
      args:
        - serve
        - --certificate
        - /ra/tls.crt
        - --private-key
        - /ra/tls.key
        - --trust-anchor-arn
        - "__TRUST_ANCHOR_ARN__"
        - --profile-arn
        - "__PROFILE_ARN__"
        - --role-arn
        - "__ESO_ROLE_ARN__"
        - --session-duration
        - "3600"
        - --hop-limit
        - "1"
        - --port
        - "9911"
        - --region
        - "eu-west-1"
      securityContext:
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        allowPrivilegeEscalation: false
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
      volumeMounts:
        - name: ra-cert
          mountPath: /ra
          readOnly: true
  volumes:
    - name: ra-cert
      secret:
        secretName: eso-ra-cert
