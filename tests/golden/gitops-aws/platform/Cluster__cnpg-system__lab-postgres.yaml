apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # After the wave-2 ExternalSecret: CNPG generates its own lab-postgres-app
    # password Secret if none exists yet, and ESO then collides with it.
    argocd.argoproj.io/sync-wave: "3"
  name: lab-postgres
  namespace: cnpg-system
spec:
  affinity:
    nodeSelector:
      workload-type: on-demand
  bootstrap:
    initdb:
      database: vkdb
      owner: vkdb
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie@sha256:42708a75345b7a48fdd9257b071830783a97fd228529196b6313187a7198e185
  instances: 1
  postgresql:
    parameters:
      max_replication_slots: "10"
      # wal_level intentionally not set — CNPG defaults it to "logical" already
      # shared_buffers / max_connections intentionally not set — sized only by
      # the requests above, not by explicit limits

      max_wal_senders: "10"
  priorityClassName: postgres-critical
  # A ceiling so one runaway query cannot take the node down. shared_buffers
  # stays at the Postgres default, so the limit does not resize the cache.
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  storage:
    # Increase-only: shrinking a PVC is rejected by Kubernetes.
    size: 20Gi
    storageClass: ebs-delete
