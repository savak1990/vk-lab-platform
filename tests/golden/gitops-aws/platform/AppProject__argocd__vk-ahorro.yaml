apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  annotations:
    # Before the pointer at wave 5: an Application naming a project that does
    # not exist yet is rejected outright, not retried.
    argocd.argoproj.io/sync-wave: "4"
  name: vk-ahorro
  namespace: argocd
spec:
  clusterResourceWhitelist:
    # CreateNamespace=true on the children needs this and nothing else.
    - group: ""
      kind: Namespace
  description: The Ahorro application. Its own repository owns everything below the pointer.
  destinations:
    - namespace: ahorro
      server: https://kubernetes.default.svc
    # The child Applications are objects in argocd, so the project must allow
    # that namespace as well as the one the workloads land in.
    - namespace: argocd
      server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  sourceRepos:
    - https://github.com/savak1990/vk-ahorro
    - ghcr.io/savak1990/vk-ahorro/charts
