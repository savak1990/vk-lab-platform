# A chat request can wait up to 600 s for the GPU to start (on-demand
# mode) plus up to 600 s of generation, like the GPU route.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "6"
  name: open-webui-traffic-policy
  namespace: chat
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: open-webui
  timeout:
    http:
      requestTimeout: 1200s
