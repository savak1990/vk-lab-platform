# cnpg-system must already exist by this wave - it does, created by
# cnpg-operator's own Application (wave -1), same precedent
# recovered-snapshot.yaml already relies on for this namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "0"
  name: lab-postgres-app
  namespace: cnpg-system
spec:
  data:
    - remoteRef:
        key: /vk-lab-platform/persistent/postgres/app_password
      secretKey: password
  # No rotation planned for this value - daily polling is enough (ESO
  # defaults to 1h if unset).
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  target:
    name: lab-postgres-app
    template:
      data:
        password: '{{ .password }}'
        username: vkdb
      type: kubernetes.io/basic-auth
