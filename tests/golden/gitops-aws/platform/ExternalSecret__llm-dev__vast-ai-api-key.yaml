# The three Secrets below are shaped exactly as the gpu-on-demand chart mounts
# them (its existingSecrets.{provider,apiKeys,ssh}); the chart's own
# ExternalSecrets stay off. Names are the ones the app's gitops/values.yaml
# references.
# client-keys and management-tokens are different values on purpose: the
# server refuses to start if one key appears in both lists.
# Rendered for production (llm) and dev (llm-dev) from the same persistent
# SSM parameters.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
  name: vast-ai-api-key
  namespace: llm-dev
spec:
  data:
    - remoteRef:
        key: /vk-lab-platform/persistent/llm/vast_ai_api_key
      secretKey: VAST_API_KEY
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  target:
    name: vast-ai-api-key
