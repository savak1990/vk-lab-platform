# Namespace read lets `helm upgrade` report a clear error instead of a
# permission failure.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: ahorro-deploy-namespace-read
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
