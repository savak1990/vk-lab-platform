# Kept off the argocd HTTPRoute deliberately - testing traffic policy here
# shouldn't risk destabilizing the UI used to watch Argo's own sync status.
# Stays aws-only: targets the grafana HTTPRoute, itself gated the same way.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
  name: grafana-traffic-policy
  namespace: observability
spec:
  # Defensive, not tight: high enough that normal dashboard use never hits
  # it, low enough that a quick curl burst demonstrably 429s.
  rateLimit:
    local:
      rules:
        - limit:
            requests: 20
            unit: Second
    type: Local
  retry:
    numRetries: 2
    perRetry:
      backOff:
        baseInterval: 100ms
        maxInterval: 2s
      timeout: 3s
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: grafana
  # A slow/dead backend fails within a few seconds rather than hanging;
  # two retries give a transient blip a chance without masking a real outage.
  timeout:
    http:
      requestTimeout: 15s
