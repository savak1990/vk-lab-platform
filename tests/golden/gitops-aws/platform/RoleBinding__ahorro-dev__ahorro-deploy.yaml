apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
  name: ahorro-deploy
  namespace: ahorro-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ahorro-deploy
subjects:
  - kind: ServiceAccount
    name: ahorro-deploy
    namespace: ahorro-dev
