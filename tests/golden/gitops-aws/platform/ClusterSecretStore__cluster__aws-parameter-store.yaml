apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "0"
  name: aws-parameter-store
spec:
  provider:
    aws:
      region: eu-west-1
      # No auth block: the external-secrets controller pod picks up its
      # Parameter Store permissions ambiently via EKS Pod Identity
      # (terraform/modules/external-secrets-pod-identity), not IRSA.

      service: ParameterStore
