apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
  name: vk-llm-ssh-key
  namespace: llm-dev
spec:
  data:
    - remoteRef:
        key: /vk-lab-platform/persistent/llm/ssh_private_key
      secretKey: id_ed25519
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  target:
    name: vk-llm-ssh-key
