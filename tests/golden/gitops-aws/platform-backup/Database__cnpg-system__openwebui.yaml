apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # After the Cluster (wave 3) has reconciled the openwebui role.
    argocd.argoproj.io/sync-wave: "4"
