apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
  name: vk-llm-api-token
  namespace: llm-dev
spec:
  data:
    - remoteRef:
        key: /vk-lab-platform/persistent/llm/api_token
      secretKey: api_token
    - remoteRef:
        key: /vk-lab-platform/persistent/chat/inference_key
      secretKey: chat_inference_key
    - remoteRef:
        key: /vk-lab-platform/persistent/llm/management_tokens
      secretKey: management-tokens
    - remoteRef:
        key: /vk-lab-platform/persistent/llm/worker_seed
      secretKey: worker-seed
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  target:
    name: vk-llm-api-token
    # Merge keeps management-tokens and worker-seed: with a template and the
    # default policy ESO writes only the templated keys.
    template:
      data:
        client-keys: |
          {{ .api_token }}
          {{ .chat_inference_key }}
      mergePolicy: Merge
