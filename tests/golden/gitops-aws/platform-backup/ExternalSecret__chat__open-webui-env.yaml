# One Secret loaded whole by envFrom; the hex-only db password keeps the URL valid.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
  name: open-webui-env
  namespace: chat
spec:
  data:
    - remoteRef:
        key: /vk-lab-platform/persistent/chat/inference_key
      secretKey: inference_key
    - remoteRef:
        key: /vk-lab-platform/persistent/chat/webui_secret_key
      secretKey: webui_secret_key
    - remoteRef:
        key: /vk-lab-platform/persistent/chat/admin_email
      secretKey: admin_email
    - remoteRef:
        key: /vk-lab-platform/persistent/chat/admin_password
      secretKey: admin_password
    - remoteRef:
        key: /vk-lab-platform/persistent/chat/db_password
      secretKey: db_password
    - remoteRef:
        key: /vk-lab-platform/persistent/chat/google_client_id
      secretKey: google_client_id
    - remoteRef:
        key: /vk-lab-platform/persistent/chat/google_client_secret
      secretKey: google_client_secret
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  target:
    name: open-webui-env
    template:
      data:
        DATABASE_URL: postgresql://openwebui:{{ .db_password }}@lab-postgres-rw.cnpg-system:5432/openwebui
        GOOGLE_CLIENT_ID: '{{ .google_client_id }}'
        GOOGLE_CLIENT_SECRET: '{{ .google_client_secret }}'
        OPENAI_API_KEY: '{{ .inference_key }}'
        # One key per Open WebUI connection; the app lists one URL per installation in this order.
        OPENAI_API_KEYS: '{{ .inference_key }};{{ .inference_key }}'
        WEBUI_ADMIN_EMAIL: '{{ .admin_email }}'
        WEBUI_ADMIN_PASSWORD: '{{ .admin_password }}'
        WEBUI_SECRET_KEY: '{{ .webui_secret_key }}'
