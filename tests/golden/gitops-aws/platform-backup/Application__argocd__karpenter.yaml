apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    # Lowest wave of anything root manages, so on teardown (reverse-wave)
    # this controller is destroyed last - after the NodePool it must drain,
    # and after every workload whose deletion needs a node to still exist.
    argocd.argoproj.io/sync-wave: "-4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: karpenter
  namespace: argocd
spec:
  destination:
    namespace: kube-system
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: karpenter
    helm:
      values: |
        replicas: 1
        settings:
          clusterName: vk-lab-platform-eks
        serviceAccount:
          name: karpenter
        nodeSelector:
          node-type: system
        controller:
          # Sized from measured usage (~170Mi over 45m); generous headroom
          # since this reconciles constantly and a crash here stalls scaling.
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 384Mi
    repoURL: public.ecr.aws/karpenter
    targetRevision: 1.14.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
