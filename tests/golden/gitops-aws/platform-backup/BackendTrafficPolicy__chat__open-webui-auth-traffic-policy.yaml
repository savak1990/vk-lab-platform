apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
  name: open-webui-auth-traffic-policy
  namespace: chat
spec:
  # Per Envoy instance, not per client: it slows password guessing, it does not stop it.
  rateLimit:
    local:
      rules:
        - limit:
            requests: 20
            unit: Second
    type: Local
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: open-webui-auth
  timeout:
    http:
      requestTimeout: 660s
