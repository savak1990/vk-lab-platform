# `observability` namespace is guaranteed to exist by this wave (created by
# kube-prometheus-stack.yaml's Application at wave 1).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
  name: grafana-admin-credentials
  namespace: observability
spec:
  data:
    - remoteRef:
        key: /vk-lab-platform/persistent/grafana/admin_password
      secretKey: password
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  target:
    name: grafana-admin-credentials
    template:
      data:
        admin-password: '{{ .password }}'
        admin-user: admin
