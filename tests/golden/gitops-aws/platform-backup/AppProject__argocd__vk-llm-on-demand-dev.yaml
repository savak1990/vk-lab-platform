apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  annotations:
    # Before the pointer at wave 5: an Application naming a project that does
    # not exist yet is rejected outright, not retried.
    argocd.argoproj.io/sync-wave: "4"
  name: vk-llm-on-demand-dev
  namespace: argocd
spec:
  clusterResourceWhitelist:
    # CreateNamespace=true on the child needs this and nothing else; the
    # namespace already exists (shared/llm/secrets.yaml), so it is a no-op here.
    - group: ""
      kind: Namespace
  description: The vk-llm-on-demand application. Its own repository owns everything below the pointer.
  destinations:
    - namespace: llm-dev
      server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  # The child Application lives in this entry's own namespace too, never in
  # argocd: an Application in the control-plane namespace could name any project.
  sourceNamespaces:
    - llm-dev
  sourceRepos:
    - https://github.com/savak1990/vk-llm-on-demand
    - ghcr.io/savak1990/vk-llm-on-demand/charts
