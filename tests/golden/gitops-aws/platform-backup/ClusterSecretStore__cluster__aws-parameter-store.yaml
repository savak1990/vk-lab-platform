apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # Wave 2, strictly after the wave-1 workload-identity Certificates: on civo
    # ESO's pod only starts once its Roles Anywhere cert exists, and a wave can
    # never settle while a resource in it waits on a later wave's health.
    argocd.argoproj.io/sync-wave: "2"
  name: aws-parameter-store
spec:
  provider:
    aws:
      region: eu-west-1
      # No auth block: each target supplies its own ambient credentials
      # (EKS Pod Identity on aws, the Roles Anywhere sidecar on civo).

      service: ParameterStore
