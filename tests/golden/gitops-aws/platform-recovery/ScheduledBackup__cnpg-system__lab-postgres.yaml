apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
  name: lab-postgres
  namespace: cnpg-system
spec:
  backupOwnerReference: self
  cluster:
    name: lab-postgres
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  # Six fields, seconds first - not a Kubernetes CronJob schedule. immediate
  # matters because a lab cluster may not live long enough to reach 03:00.
  schedule: 0 0 3 * * *
