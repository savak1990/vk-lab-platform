apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-3"
  name: spot
spec:
  disruption:
    consolidateAfter: 1m
    consolidationPolicy: WhenEmpty
  limits:
    # Node-count cap, not a vCPU budget - keep in sync with instanceTypes'
    # vCPU count when overriding either value.
    cpu: "4"
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - spot
        - key: kubernetes.io/arch
          operator: In
          values:
            - arm64
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - t4g.medium
            - t4g.large
            - m6g.medium
            - m6g.large
            - m7g.medium
            - m7g.large
