# Stays gated: lives in and targets the observability namespace, which only
# kube-prometheus-stack's Application creates (aws-only until CIVO-160) -
# unconditional here would fail apply with "namespaces \"observability\" not found".
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
  name: grafana
  namespace: observability
spec:
  hostnames:
    - grafana.
  parentRefs:
    - name: platform-gateway
      namespace: envoy
      sectionName: https
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
