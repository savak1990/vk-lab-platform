apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    # After cert-manager, whose issuer the plugin needs for its own serving
    # certificate, and before the Cluster that references it.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: barman-cloud-plugin
  namespace: argocd
spec:
  destination:
    # The plugin only works in the operator's own namespace.
    namespace: cnpg-system
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: plugin-barman-cloud
    helm:
      parameters:
        - name: sidecarImage.registry
          value: ghcr.io
        - name: sidecarImage.repository
          value: cloudnative-pg/plugin-barman-cloud-sidecar
        # The chart composes registry/repository:tag, so a bare digest is not
        # expressible; tag@digest is a valid reference and resolves by digest.
        - name: sidecarImage.tag
          value: v0.15.0@sha256:06c78deca670525daa35fb1e5323159092785d11cf87b86217bdd5c679a41a84
      values: |
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 128Mi
    repoURL: ghcr.io/cloudnative-pg/charts
    targetRevision: 0.8.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
