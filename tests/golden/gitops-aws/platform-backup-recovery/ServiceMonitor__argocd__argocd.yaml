# One ServiceMonitor covers all 5 Argo CD metrics Services (controller,
# server, repo-server, applicationset, notifications) - they all share
# these two labels and the http-metrics port name. Requires
# scripts/argo-up.sh's *.metrics.enabled=true flags to exist at all.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
  name: argocd
  namespace: argocd
spec:
  endpoints:
    - interval: 30s
      port: http-metrics
  selector:
    matchLabels:
      app.kubernetes.io/instance: argocd
      app.kubernetes.io/part-of: argocd
