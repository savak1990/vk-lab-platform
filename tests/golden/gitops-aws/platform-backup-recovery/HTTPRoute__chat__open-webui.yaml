# One after the Application, which creates the Service these target;
# a route whose backend is missing yet reports Degraded and would stall the sync.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "6"
  name: open-webui
  namespace: chat
spec:
  hostnames:
    - chat.
  parentRefs:
    - name: platform-gateway
      namespace: envoy
      sectionName: https
  rules:
    - backendRefs:
        - name: open-webui
          port: 80
