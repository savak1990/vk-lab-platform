apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
  name: openwebui-db
  namespace: cnpg-system
spec:
  data:
    - remoteRef:
        key: /vk-lab-platform/persistent/chat/db_password
      secretKey: password
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  target:
    name: openwebui-db
    template:
      data:
        password: '{{ .password }}'
        username: openwebui
      metadata:
        labels:
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
