# All /api/v1/auths/* endpoints. The longer prefix wins over the main route,
# so a cold page load (dozens of parallel assets) never meets the rate limit.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "6"
  name: open-webui-auth
  namespace: chat
spec:
  hostnames:
    - chat.
  parentRefs:
    - name: platform-gateway
      namespace: envoy
      sectionName: https
  rules:
    - backendRefs:
        - name: open-webui
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /api/v1/auths/
