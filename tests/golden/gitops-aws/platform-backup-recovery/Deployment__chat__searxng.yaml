apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  name: searxng
  namespace: chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            # One worker is enough for a household; the image default of 5 idles near 500 MiB.
            - name: GRANIAN_WORKERS
              value: "1"
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  key: WEBUI_SECRET_KEY
                  name: open-webui-env
          image: docker.io/searxng/searxng:2026.11.23-a7163d091@sha256:a7fc607aa6723f5a8982105bcc5ffba4d1b9fc7c6922a31a88d6e4cba49ef12a
          name: searxng
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 128Mi
          volumeMounts:
            - mountPath: /etc/searxng/settings.yml
              name: settings
              subPath: settings.yml
      volumes:
        - configMap:
            name: searxng
          name: settings
