name: lab

# Manually triggered only - this starts/stops real, billable infrastructure.
# `provider` selects the whole stack (project defaults, Terraform directories,
# identity mechanism); the Makefile owns those defaults, so a blank
# project_name/subdomain means "whatever that provider uses". The assumed role
# (lab-role) is account-global and shared by every project and both providers -
# its permission policy scopes by naming convention, so an arbitrary
# project_name needs no IAM change; the Makefile validates the name into the
# shape those wildcards already match. `target` maps 1:1 onto a `make` target -
# no remapping, no per-target gating; whatever safety behavior a given target's
# script already has (persistent-down/bootstrap-down/account-down's
# CONFIRM_DESTROY check) is unaffected by this workflow, just wired through from
# confirm_destroy below. `region`, `worker_node_type`, `min_worker_nodes` and
# `max_worker_nodes` size the cluster. The two node-type inputs are dropdowns
# listing every type the catalogue sells, each labelled with the provider that
# sells it: GitHub has no dependent dropdowns, so one flat list is as close as
# the form gets, and it cannot express that cx43 sells in nbg1 but not hel1.
# Picking a type the chosen provider and region do not sell is therefore still
# possible, and the offline gate refuses it in the job's first seconds rather
# than deep inside an apply. `control_plane_node_type` sizes the one server the
# platform owns itself, on hetzner alone.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "provider"
        type: choice
        options:
          - aws
          - civo
          - hetzner
        default: aws
      # Blank uses the provider's default - vk-lab-platform on aws,
      # vk-civo-lab on civo. Lowercase alphanumeric and hyphen, 23 characters
      # at most. A new name creates a wholly separate cluster and state bucket.
      project_name:
        description: "project_name (blank = default)"
        type: string
        default: ""
      # Blank uses the provider's default - lab on aws, civo on civo. Give a
      # custom project its own; require-unique-subdomain.sh refuses a zone
      # another project already owns, before any apply.
      subdomain:
        description: "subdomain (blank = default)"
        type: string
        default: ""
      # civo and hetzner only. Blank uses the provider's default - LON1 on
      # civo, fsn1 on hetzner. aws refuses a value here: its region is fixed
      # at eu-west-1, and the offline gate says so in the job's first seconds.
      region:
        description: "region (civo/hetzner only)"
        type: string
        default: ""
      # The first option keeps the provider's default - g4s.kube.medium on
      # civo, cx43 on hetzner (cx33 in hel1), t4g.medium on aws. The rest are
      # every type scripts/lib/catalog.sh sells, and node-config-test.sh fails
      # if this list and that one drift apart.
      worker_node_type:
        description: "worker_node_type"
        type: choice
        options:
          - "default (provider decides)"
          - "aws: t4g.medium"
          - "aws: t4g.large"
          - "aws: m6g.large"
          - "civo: g4s.kube.medium"
          - "civo: g4s.kube.large"
          - "civo: g4m.kube.small"
          - "civo: g4p.kube.small"
          - "hetzner: cx23"
          - "hetzner: cx33"
          - "hetzner: cx43"
          - "hetzner: cx53"
          - "hetzner: cpx32"
          - "hetzner: cpx42"
        default: "default (provider decides)"
      # Worker nodes only, never a control plane. Blank uses the provider's
      # default: 3-4 on civo, 1-2 on hetzner, 1-3 on aws. On aws the ceiling is
      # not a node count Karpenter understands, so it is converted to a vCPU
      # limit per NodePool at two vCPU per node.
      min_worker_nodes:
        description: "min_worker_nodes"
        type: string
        default: ""
      max_worker_nodes:
        description: "max_worker_nodes"
        type: string
        default: ""
      # hetzner only, where the platform creates the control plane itself and
      # pays for it. The first option keeps cx23. A value on any other provider
      # is refused by the offline gate, since nothing there would read it.
      control_plane_node_type:
        description: "control_plane_node_type (hetzner only)"
        type: choice
        options:
          - "default (hetzner cx23)"
          - "hetzner: cx23"
          - "hetzner: cx33"
          - "hetzner: cx43"
          - "hetzner: cx53"
          - "hetzner: cpx32"
          - "hetzner: cpx42"
        default: "default (hetzner cx23)"
      target:
        description: "target"
        type: choice
        options:
          - status
          - up
          - down
          - argo-up
          - argo-down
          - test
          - platform-up
          - platform-down
          - full-up
          - full-down
        default: up
      # civo only, inert on aws. Untick for a throwaway project: staging
      # spares the production quota shared with the personal lab.
      production_tls:
        description: "production_tls (civo/hetzner only)"
        type: boolean
        default: true
      # platform-down/full-down only. Type the RESOLVED project name exactly:
      # what project_name holds, or the provider default when it is blank.
      confirm_destroy:
        description: "confirm_destroy (resolved project name)"
        type: string
        default: ""

# The two literals mirror Makefile:17-23. They are display and grouping only -
# the run itself never reads them, so a drift would mislabel a run, never
# retarget one. Neither run-name nor concurrency can read a step output, so
# the resolved name cannot come from the resolve step below.
run-name: "lab: ${{ inputs.target }} (${{ inputs.provider }}/${{ inputs.project_name || (inputs.provider == 'civo' && 'vk-civo-lab' || inputs.provider == 'hetzner' && 'vk-hetzner-lab' || 'vk-lab-platform') }})"

# Different projects are independent stacks and may run in parallel; two runs
# against the same project would race on its Terraform state, so they queue.
# The group uses the resolved name, so a blank input and the default typed out
# in full land in the same group rather than racing each other.
concurrency:
  group: lab-${{ inputs.provider }}-${{ inputs.project_name || (inputs.provider == 'civo' && 'vk-civo-lab' || inputs.provider == 'hetzner' && 'vk-hetzner-lab' || 'vk-lab-platform') }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # full-up/full-down can run close to/over an hour; caps a hung step well short of the 4h role session
    steps:
      - uses: actions/checkout@v4

      # An environment variable set to "" still counts as defined for make's
      # ?=, which would defeat the Makefile's per-provider defaults - so a
      # blank input is omitted entirely rather than exported empty.
      - name: Resolve lifecycle inputs
        env:
          IN_PROVIDER: ${{ inputs.provider }}
          IN_PROJECT_NAME: ${{ inputs.project_name }}
          IN_SUBDOMAIN: ${{ inputs.subdomain }}
          IN_REGION: ${{ inputs.region }}
          IN_WORKER_NODE_TYPE: ${{ inputs.worker_node_type }}
          IN_MIN_WORKER_NODES: ${{ inputs.min_worker_nodes }}
          IN_MAX_WORKER_NODES: ${{ inputs.max_worker_nodes }}
          IN_CONTROL_PLANE_NODE_TYPE: ${{ inputs.control_plane_node_type }}
        run: |
          set -euo pipefail
          case "$IN_PROVIDER:$IN_PROJECT_NAME" in
            aws:vk-civo-lab | aws:vk-hetzner-lab \
            | civo:vk-lab-platform | civo:vk-hetzner-lab \
            | hetzner:vk-lab-platform | hetzner:vk-civo-lab)
              echo "::error::project_name '$IN_PROJECT_NAME' is another provider's default; leave it blank or pick a distinct name." >&2
              exit 1
              ;;
          esac
          echo "PROVIDER=$IN_PROVIDER" >> "$GITHUB_ENV"
          [ -n "$IN_PROJECT_NAME" ] && echo "PROJECT_NAME=$IN_PROJECT_NAME" >> "$GITHUB_ENV"
          [ -n "$IN_SUBDOMAIN" ] && echo "SUBDOMAIN=$IN_SUBDOMAIN" >> "$GITHUB_ENV"
          [ -n "$IN_REGION" ] && echo "REGION=$IN_REGION" >> "$GITHUB_ENV"
          # The two node-type dropdowns label each type with the provider that
          # sells it; only the type itself reaches Make, and the "default"
          # option means "change nothing", so Make's ?= default still wins.
          node_type_of() {
            case "$1" in
              default*) echo "" ;;
              *) echo "${1##* }" ;;
            esac
          }
          IN_WORKER_NODE_TYPE="$(node_type_of "$IN_WORKER_NODE_TYPE")"
          IN_CONTROL_PLANE_NODE_TYPE="$(node_type_of "$IN_CONTROL_PLANE_NODE_TYPE")"

          [ -n "$IN_WORKER_NODE_TYPE" ] && echo "WORKER_NODE_TYPE=$IN_WORKER_NODE_TYPE" >> "$GITHUB_ENV"
          [ -n "$IN_MIN_WORKER_NODES" ] && echo "MIN_WORKER_NODES=$IN_MIN_WORKER_NODES" >> "$GITHUB_ENV"
          [ -n "$IN_MAX_WORKER_NODES" ] && echo "MAX_WORKER_NODES=$IN_MAX_WORKER_NODES" >> "$GITHUB_ENV"
          [ -n "$IN_CONTROL_PLANE_NODE_TYPE" ] && echo "CONTROL_PLANE_NODE_TYPE=$IN_CONTROL_PLANE_NODE_TYPE" >> "$GITHUB_ENV"
          exit 0

      # The test job below does not fire for target `test` - it only follows an
      # up-like target - so that dispatch runs make test right here.
      - uses: actions/setup-go@v5
        if: inputs.target == 'test'
        with:
          go-version-file: go.mod

      - name: Set up the lab toolchain
        uses: ./.github/actions/setup-lab-tools
        with:
          provider: ${{ inputs.provider }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1
          role-duration-seconds: 14400 # full-up/full-down can run close to/over an hour; matches the role's own max_session_duration

      # After the AWS credentials: the token is KMS ciphertext in the repo, so
      # decrypting it needs the assumed role. ::add-mask:: must reach the step's
      # own stdout, never a $(...) capture, and is per job.
      - name: Register the Civo token mask
        if: inputs.provider != 'aws'
        run: bash -c 'source scripts/lib/region.sh; source scripts/lib/provider.sh; case "$PROVIDER" in civo) civo_token ;; hetzner) hcloud_token ;; esac'

      - run: make ${{ inputs.target }}
        env:
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
          # Argo CD otherwise reconciles gitops/ from main regardless of the
          # dispatched ref, so a branch run could not test a GitOps change.
          TARGET_REVISION: ${{ github.ref_name }}
          # Read by argo-up.sh's civo and hetzner branches; inert on aws.
          TLS_ISSUER: ${{ inputs.production_tls && 'letsencrypt-prod' || 'letsencrypt-staging' }}

      # argo-down exports the serving certificate to an Advanced-tier
      # SecureString that survives teardown on purpose, to spare an ACME order
      # on the next bring-up. Advanced tier is billed per parameter per month,
      # and a staging certificate is worth nothing to keep - so a staging one is
      # dropped and a production one is left alone. The decision reads the
      # stored certificate's own issuer rather than this run's production_tls
      # input: the input is per dispatch, so a teardown that forgot to repeat it
      # would silently leave a billed parameter behind. Anything unreadable is
      # kept, never deleted.
      - name: Drop a staging TLS parameter left by full-down
        env:
          DEFAULT_PROJECT: ${{ inputs.provider == 'civo' && 'vk-civo-lab' || inputs.provider == 'hetzner' && 'vk-hetzner-lab' || 'vk-lab-platform' }}
        if: always() && inputs.provider != 'aws' && inputs.target == 'full-down'
        run: |
          set -uo pipefail
          NAME="/${PROJECT_NAME:-$DEFAULT_PROJECT}/persistent/${PROVIDER}/tls/platform-public"
          VALUE="$(aws ssm get-parameter --region eu-west-1 --name "$NAME" \
            --with-decryption --query 'Parameter.Value' --output text 2>/dev/null || true)"
          if [ -z "$VALUE" ] || [ "$VALUE" = "None" ]; then
            echo "no $NAME stored - nothing to do."
            exit 0
          fi
          ISSUER="$(printf '%s' "$VALUE" | grep -m1 -E '^[[:space:]]+tls\.crt:' \
            | sed 's/.*: *//' | base64 -d 2>/dev/null | openssl x509 -noout -issuer 2>/dev/null || true)"
          case "$ISSUER" in
            *STAGING*)
              aws ssm delete-parameter --region eu-west-1 --name "$NAME"
              echo "deleted $NAME - $ISSUER" ;;
            "")
              echo "kept $NAME - could not read its issuer." ;;
            *)
              echo "kept $NAME - $ISSUER" ;;
          esac

  # Verifies the platform is actually usable, not just Synced/Healthy - runs
  # after any target that leaves a disposable cluster up, using the same
  # `make test` a developer runs locally. A separate job (its own runner,
  # its own OIDC/kubeconfig setup) so it shows as its own status in the UI
  # rather than as a step buried inside lifecycle's.
  test:
    needs: lifecycle
    if: contains(fromJSON('["up", "argo-up", "platform-up", "full-up"]'), inputs.target)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Resolve lifecycle inputs
        env:
          IN_PROVIDER: ${{ inputs.provider }}
          IN_PROJECT_NAME: ${{ inputs.project_name }}
          IN_SUBDOMAIN: ${{ inputs.subdomain }}
          IN_REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail
          echo "PROVIDER=$IN_PROVIDER" >> "$GITHUB_ENV"
          [ -n "$IN_PROJECT_NAME" ] && echo "PROJECT_NAME=$IN_PROJECT_NAME" >> "$GITHUB_ENV"
          [ -n "$IN_SUBDOMAIN" ] && echo "SUBDOMAIN=$IN_SUBDOMAIN" >> "$GITHUB_ENV"
          [ -n "$IN_REGION" ] && echo "REGION=$IN_REGION" >> "$GITHUB_ENV"
          exit 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # make test-kubeconfig reaches configure_test_kubeconfig, which builds the
      # kubeconfig through the Civo CLI - but nothing here shells out to
      # terraform, terragrunt or helm, hence scope: test.
      - name: Set up the lab toolchain
        uses: ./.github/actions/setup-lab-tools
        with:
          provider: ${{ inputs.provider }}
          scope: test

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1
          role-duration-seconds: 14400 # was previously omitted here, silently defaulting to 3600s unlike the lifecycle job

      - name: Register the Civo token mask
        if: inputs.provider != 'aws'
        run: bash -c 'source scripts/lib/region.sh; source scripts/lib/provider.sh; case "$PROVIDER" in civo) civo_token ;; hetzner) hcloud_token ;; esac'

      - run: make test
        env:
          # A staging certificate chains to a root no Go client trusts. An aws
          # run and a production civo run leave this blank, so a real
          # certificate regression still fails the suite.
          E2E_INSECURE_TLS: ${{ (inputs.provider == 'civo' && !inputs.production_tls) && '1' || '' }}
