name: lab

# Manually triggered only - this starts/stops real, billable AWS
# infrastructure. The assumed role (lab-role) is account-global and shared
# by every project - its permission policy scopes by naming convention, not
# a hand-enumerated per-combination list. `target` maps 1:1 onto a `make`
# target - no remapping, no per-target gating; whatever safety behavior a
# given target's script already has (bootstrap-down/account-down's
# CONFIRM_DESTROY check) is unaffected by this workflow, just wired through
# from confirm_destroy below.
on:
  workflow_dispatch:
    inputs:
      project_name:
        description: PROJECT_NAME
        type: choice
        options: [vk-lab-platform]
        default: vk-lab-platform
      subdomain:
        description: SUBDOMAIN
        type: choice
        options: [lab]
        default: lab
      region:
        description: PROJECT_REGION
        type: choice
        options: [eu-west-1]
        default: eu-west-1
      target:
        description: make target
        type: choice
        options:
          - status
          - up
          - down
          - argo-up
          - argo-down
          - platform-up
          - platform-down
          - full-up
          - full-down
        default: up
      confirm_destroy:
        description: "Only for full-down (which reaches bootstrap-down): type PROJECT_NAME exactly to confirm."
        type: string
        default: ""

run-name: "lab: ${{ inputs.target }} (${{ inputs.project_name }})"

permissions:
  id-token: write
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: ${{ inputs.project_name }}
      SUBDOMAIN: ${{ inputs.subdomain }}
      PROJECT_REGION: ${{ inputs.region }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9" # matches every module's required_version
          terraform_wrapper: false # the wrapper breaks terragrunt's own stdout/stderr capture

      # No official Terragrunt setup action - ubuntu-latest doesn't ship it
      # (unlike aws-cli/kubectl/helm/jq, confirmed already present). Pinned
      # release binary, checksum-verified before trusting it.
      - name: Set up Terragrunt
        run: |
          TG_VERSION=1.1.3
          curl -sSL -o terragrunt_linux_amd64 "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          curl -sSL -o SHA256SUMS "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/SHA256SUMS"
          grep " terragrunt_linux_amd64$" SHA256SUMS | sha256sum -c -
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt

      # ubuntu-latest's preinstalled helm predates --server-side/--force-conflicts
      # (argo-up.sh's root-application install, also used by argo-down.sh's
      # `helm status`/`helm uninstall`). Pinned to the same version used to
      # develop this repo.
      - uses: azure/setup-helm@v4
        with:
          version: "v4.1.4"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
          role-duration-seconds: 14400 # full-up/full-down can run close to/over an hour; matches the role's own max_session_duration

      # ROOT_DOMAIN is a GitHub secret, not decrypted from secrets/root-domain.enc -
      # only needed by persistent-up/full-up/platform-up; harmless to set
      # unconditionally for every other target.
      - run: make ${{ inputs.target }}
        env:
          ROOT_DOMAIN: ${{ secrets.ROOT_DOMAIN }}
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
