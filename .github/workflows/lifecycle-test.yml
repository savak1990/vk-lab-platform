name: lifecycle-test

# On-demand full-lifecycle validation (constitution §11, spec 014, spec 020):
# full-up -> test -> full-down against an isolated project/subdomain, always
# torn down even on failure. Isolation is by PROJECT_NAME/SUBDOMAIN (ADR
# 0026), not a separate terraform/live/ci/ tree - a deliberate, documented
# deviation from spec 020 Requirement 2, reusing lab.yml's existing
# per-project isolation instead of building a second state hierarchy.
on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "PROJECT_NAME for this run - use a name distinct from your personal lab's."
        type: string
        default: vk-lab-ci
      subdomain:
        description: "SUBDOMAIN for this run - must be unique per project (scripts/require-unique-subdomain.sh enforces this)."
        type: string
        default: ci

run-name: "lifecycle-test (${{ inputs.project_name }})"

# Same group expression lab.yml uses. Isolation here is by PROJECT_NAME, not
# a separate state tree, so a run against the same project_name from either
# workflow must queue rather than race the same S3 state - a distinct group
# name would defeat that.
concurrency:
  group: lab-${{ inputs.project_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  PROJECT_NAME: ${{ inputs.project_name }}
  SUBDOMAIN: ${{ inputs.subdomain }}
  # Known credentials for debugging a failed run (logging into ArgoCD/Grafana
  # as test/test rather than digging a generated password out of a torn-down
  # cluster), and a prerequisite if this workflow later grows a mode=resilience
  # recreate cycle (spec 020) - a fresh runner regenerating a random
  # postgres-app-password would desync from a snapshot-recovered database
  # (generate-secrets.sh's own warning, ADR 0014). Accepted exposure: ArgoCD/
  # Grafana admin password is the literal string "test", reachable over public
  # HTTPS at argo.<subdomain>.<root-domain> for this run's ~1.5h - see ADR 0026.
  FIXED_TEST_PASSWORDS: "true"

jobs:
  # Static checks (spec 019/architecture.md §26), folded into this
  # manually-triggered workflow rather than a separate PR-triggered
  # validate.yml - one verification entrypoint for now; PR enforcement is a
  # deliberate later step, not implemented here. These gate `up` so a
  # failure costs no AWS time/spend.
  validate-terraform:
    # Narrows away the top-level id-token: write - none of spec 019's
    # checks touch AWS, so this job has no use for an OIDC token.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - name: Set up Terragrunt
        run: |
          TG_VERSION=1.1.3
          curl -sSL -o terragrunt_linux_amd64 "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          curl -sSL -o SHA256SUMS "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/SHA256SUMS"
          grep " terragrunt_linux_amd64$" SHA256SUMS | sha256sum -c -
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt

      - name: terraform fmt -check
        run: terraform fmt -check -recursive terraform/

      - name: terraform validate (every module)
        run: |
          set -euo pipefail
          for m in terraform/modules/*/; do
            m="${m%/}"
            echo "== $m =="
            (cd "$m" && terraform init -backend=false -input=false && terraform validate)
          done

      # Units with a `dependency` block are skipped: terragrunt resolves
      # `dependency.x.outputs` by running `terraform output -json` directly
      # in the dependency's own working directory, which hard-fails without
      # a real initialized backend rather than falling back to
      # mock_outputs (reproduced locally against this repo's units, not a
      # config mistake) - giving this job real AWS/S3 reachability just to
      # validate HCL would defeat the point. Their module code is still
      # covered by the loop above; cluster/eks, the four
      # cluster/*-pod-identity units, cluster-civo/{k8s,network},
      # bootstrap/{acm,rolesanywhere} are the ones skipped here.
      - name: terragrunt validate (non-dependency live units)
        run: |
          set -euo pipefail
          export TF_CLI_ARGS_init="-backend=false"
          for u in \
            account-state \
            account/eks-access-identity \
            account/eks-test-identity \
            account/github-oidc \
            account/kms \
            account/lab-role \
            account/root-domain \
            bootstrap/route53 \
            persistent-civo/network \
            persistent-civo/reserved-ip \
            persistent/secrets \
            persistent/vpc \
            state; do
            echo "== $u =="
            (cd "terraform/live/$u" && terragrunt validate --non-interactive)
          done

      # soft_fail: report-only for now - a real scan against this repo
      # found 41 findings (3 critical/31 high/7 medium), many likely
      # corresponding to already-documented, deliberate decisions (no NAT
      # gateway/public-only subnets - ADR 0020, lab-role's
      # naming-convention-scoped wildcard, no EKS control-plane logging by
      # cost/lab-scope defaults, etc.), not yet triaged into scoped
      # ignores. Flip to blocking once triaged.
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/
          soft_fail: true

  validate-gitops:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "v4.1.4"

      - name: helm lint
        # gitops/argocd is a values.yaml for the Argo CD install script, not
        # a chart directory (no Chart.yaml) - covered by validate-yaml
        # instead.
        run: |
          helm lint gitops/
          helm lint gitops/bootstrap

      # Placeholder values only (constitution's "never a real root domain"
      # rule) - without them envoyGateway.fqdn defaults to "" and
      # HTTPRoute hostnames render as e.g. "argo." (invalid). target=local
      # and per-component values-aws.yaml/values-local.yaml (spec 022
      # Requirement 17) are deferred until spec 022's umbrella-chart split
      # lands - this validates the chart as it actually exists today.
      - name: helm template (target=aws, target=civo)
        run: |
          set -euo pipefail
          helm template gitops/ \
            --set target=aws \
            --set envoyGateway.fqdn=lab.example.com \
            --set envoyGateway.acmCertificateArn=arn:aws:acm:eu-west-1:123456789012:certificate/dummy \
            --set envoyGateway.nlbSubnetIds=subnet-dummy \
            > rendered-aws.yaml
          helm template gitops/ \
            --set target=civo \
            --set envoyGateway.fqdn=lab.example.com \
            --set envoyGateway.reservedIp=1.2.3.4 \
            --set envoyGateway.firewallId=fw-dummy \
            > rendered-civo.yaml

      - name: Install kubeconform
        run: |
          KC_VERSION=0.7.0
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KC_VERSION}/kubeconform-linux-amd64.tar.gz" -o kubeconform.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      # Default schema set doesn't recognize this platform's CRDs
      # (Karpenter, Envoy Gateway, Gateway API, cert-manager,
      # external-secrets, Prometheus Operator, VolumeSnapshotClass) -
      # CRDs-catalog covers those; -ignore-missing-schemas is a last-resort
      # net for anything still unrecognized, not a substitute for it.
      - name: kubeconform
        run: |
          kubeconform -summary -strict -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered-aws.yaml rendered-civo.yaml

  validate-yaml:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install yamllint

      # gitops/templates/**/*.yaml are Helm templates, not plain YAML - bare
      # `{{- if ... }}` lines aren't valid YAML as raw text. Their
      # correctness is covered by helm template + kubeconform (above)
      # instead; yamllint only runs against genuinely plain YAML.
      - run: |
          yamllint -c .yamllint.yml \
            .github/workflows/*.yml \
            gitops/Chart.yaml gitops/values.yaml \
            gitops/bootstrap/*.yaml \
            gitops/argocd/*.yaml

  validate-actions:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          AL_VERSION=1.7.12
          curl -sSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${AL_VERSION}/actionlint_${AL_VERSION}_linux_amd64.tar.gz"
          curl -sSL -o checksums.txt "https://github.com/rhysd/actionlint/releases/download/v${AL_VERSION}/actionlint_${AL_VERSION}_checksums.txt"
          grep "actionlint_${AL_VERSION}_linux_amd64.tar.gz$" checksums.txt | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/actionlint

      - run: actionlint .github/workflows/*.yml

  validate-secrets:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  up:
    needs:
      - validate-terraform
      - validate-gitops
      - validate-yaml
      - validate-actions
      - validate-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - name: Set up Terragrunt
        run: |
          TG_VERSION=1.1.3
          curl -sSL -o terragrunt_linux_amd64 "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          curl -sSL -o SHA256SUMS "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/SHA256SUMS"
          grep " terragrunt_linux_amd64$" SHA256SUMS | sha256sum -c -
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt

      - uses: azure/setup-helm@v4
        with:
          version: "v4.1.4"

      # Not needed by lab.yml's `up`/`down` targets since they never reach a
      # fresh bootstrap-up/argo-up on a from-scratch project in the same run
      # the way this workflow's full-up does.
      - name: Install dig and htpasswd
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils apache2-utils

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1
          role-duration-seconds: 14400

      - run: make full-up

  test:
    needs: up
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1
          role-duration-seconds: 14400

      - run: make test

  # Always runs, even if `up` or `test` failed or the run was cancelled - a
  # separate job with its own if: always(), not an always()-guarded step
  # inside `up`, because a step-level always() does not run once the runner
  # itself is torn down by a cancellation (the reason the failure-path
  # question at the start of this workflow's design was decided this way).
  down:
    needs: [up, test]
    # always() alone would also fire when the new validate-* jobs fail `up`
    # out of the run entirely (needs.up.result == 'skipped') - full-down
    # against a project this run never created is pointless at best; guard
    # against it rather than relying on full-down's own idempotency.
    if: always() && needs.up.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - name: Set up Terragrunt
        run: |
          TG_VERSION=1.1.3
          curl -sSL -o terragrunt_linux_amd64 "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          curl -sSL -o SHA256SUMS "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/SHA256SUMS"
          grep " terragrunt_linux_amd64$" SHA256SUMS | sha256sum -c -
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt

      - uses: azure/setup-helm@v4
        with:
          version: "v4.1.4"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1
          role-duration-seconds: 14400

      - run: make full-down
        env:
          # Always this run's own project_name, not a user-typed input - every
          # dispatch of this workflow is expected to end in full-down (ADR
          # 0026 decision 1), so there is no confirmation decision left to make.
          CONFIRM_DESTROY: ${{ inputs.project_name }}
