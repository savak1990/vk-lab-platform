name: lifecycle-test

# The merge gate. Static checks on every pull request; a full lifecycle -
# full-up, make test, full-down against a real cluster - when a maintainer adds
# a lifecycle label. `pr-gate` below is the single required status check on
# main.
#
# One label per cloud: `ci:lifecycle-aws`, `ci:lifecycle-civo`, and
# `ci:lifecycle-hetzner` once that job exists. Each is its own trigger - there
# is no separate `ci:lifecycle` to arm them, and no label means no cloud run.
#
# Add every label you want in ONE edit. Each label event starts a run, and the
# cloud jobs are serialized per provider rather than cancelled, so adding two
# labels in two edits runs the first provider twice.
#
# kind is not a label. `kind-integration` runs on every change that is not
# documentation-only, and must pass: it reaches no cloud, needs no credential
# and costs nothing, so there is nothing to opt into.
#
# kind alone does not carry an infrastructure change. `pr-gate` requires one
# cloud to have run and passed, or the `ci:skip-lifecycle` waiver.
#
# The cloud half stays opt-in because two providers together cost roughly 55
# minutes and a little under a dollar. Adding a cloud's label starts that
# cloud's run against the pull request's current head commit; removing and
# re-adding it is the re-run handle.
#
# Isolation is by PROJECT_NAME/SUBDOMAIN (ADR 0026), not a separate
# terraform/live/ci/ tree - a documented deviation from spec AWS-020
# Requirement 2, reusing the per-project isolation lab.yml already has.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_dispatch:

run-name: >-
  lifecycle-test${{ github.event_name == 'pull_request' && format(' (#{0})', github.event.pull_request.number) || ' (manual)' }}

# No workflow-level concurrency: a new push cancels only the older run's
# validate jobs. The lifecycle jobs never cancel - that would kill a teardown and
# leak a cluster - and their own groups serialize the shared Terraform state.

permissions:
  id-token: write
  contents: read

jobs:
  # Classifies the pull request once, so every later job asks the same question
  # of the same answer. Three outputs:
  #   docs_only - every changed file is Markdown; the four heavy validate jobs
  #               below skip themselves.
  #   terraform - a file validate-terraform reads changed; it skips otherwise.
  #   infra     - a file on the merge-blocking path list changed; pr-gate then
  #               requires the lifecycle check or its waiver.
  #
  # Fails closed: on a manual dispatch, or if the diff cannot be computed, it
  # reports docs_only=false and terraform=infra=true, so everything runs.
  changes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      terraform: ${{ steps.classify.outputs.terraform }}
      infra: ${{ steps.classify.outputs.infra }}
      infra_files: ${{ steps.classify.outputs.infra_files }}
      run_aws: ${{ steps.labels.outputs.run_aws }}
      run_civo: ${{ steps.labels.outputs.run_civo }}
      run_hetzner: ${{ steps.labels.outputs.run_hetzner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Read once here so every later job asks the same question of the same
      # answer, and so the label names live in one place rather than in a
      # `contains()` chain per provider per job.
      #
      # A cloud runs when its own label is present, and not otherwise. A manual
      # dispatch runs every cloud that has a job.
      #
      # Matched with jq rather than the `contains()` expression so the
      # comparison is exact string equality, not whatever a future label name
      # makes of a substring test.
      - id: labels
        env:
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          # hetzner has a label but no job yet, so a dispatch must not reach
          # for it - pr-gate refuses it out loud instead.
          CLOUDS="aws civo hetzner"
          DISPATCH_RUNS="aws civo"

          has() {
            printf '%s' "${LABELS:-[]}" | jq -e --arg x "$1" 'any(.[]?; . == $x)' > /dev/null
          }

          for p in $CLOUDS; do
            run=false
            if [ "$DISPATCH" = "true" ]; then
              case " $DISPATCH_RUNS " in *" $p "*) run=true ;; esac
            elif has "ci:lifecycle-$p"; then
              run=true
            fi
            echo "run_$p=$run" >> "$GITHUB_OUTPUT"
            echo "run_$p=$run"
          done

      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          DOCS_ONLY=false
          TERRAFORM=true
          INFRA=true
          INFRA_FILES=""

          if [ "$EVENT_NAME" = "pull_request" ] \
            && git fetch --quiet origin "$BASE_REF" \
            && CHANGED="$(git diff --name-only "origin/${BASE_REF}...HEAD")" \
            && [ -n "$CHANGED" ]; then
            echo "changed files:"
            printf '%s\n' "$CHANGED" | sed 's/^/  /'

            # Docs-only means every file, not most of them: one .yml among
            # twenty .md files is not a documentation change.
            if ! printf '%s\n' "$CHANGED" | grep -qvE '\.md$'; then
              DOCS_ONLY=true
            fi

            # secrets/ is read by terragrunt at parse time; this workflow is
            # here so that a change to the job itself always runs it.
            if ! printf '%s\n' "$CHANGED" | grep -vE '\.md$' \
              | grep -qE '^(terraform/|secrets/|\.github/workflows/lifecycle-test\.yml$)'; then
              TERRAFORM=false
            fi

            # This list is the merge-blocking surface of the repository.
            # Markdown is excluded first, even under these paths: a README in
            # scripts/ changes no behavior. It also keeps the two outputs
            # consistent - docs_only=true then always implies infra=false.
            # Without that, a docs-only change under scripts/ would skip the
            # validate jobs, and so the lifecycle jobs that need them, while
            # pr-gate demanded a lifecycle result no label could produce.
            INFRA_FILES="$(printf '%s\n' "$CHANGED" | grep -vE '\.md$' \
              | grep -E '^(terraform/|gitops/|scripts/|tests/|images/|go\.(mod|sum)$|Makefile$|\.github/(workflows|actions)/)' || true)"
            if [ -z "$INFRA_FILES" ]; then
              INFRA=false
            fi
          else
            echo "not a pull request, or the diff could not be computed - running everything."
          fi

          echo "docs_only=$DOCS_ONLY  terraform=$TERRAFORM  infra=$INFRA"
          {
            echo "docs_only=$DOCS_ONLY"
            echo "terraform=$TERRAFORM"
            echo "infra=$INFRA"
            echo "infra_files<<CHANGES_EOF"
            printf '%s\n' "$INFRA_FILES"
            echo "CHANGES_EOF"
          } >> "$GITHUB_OUTPUT"

  # Static checks (spec 019/architecture.md §26). They gate the lifecycle jobs,
  # so a lint failure costs no cloud time.
  #
  # The four heavy ones skip on a documentation-only pull request. !cancelled()
  # rather than the default success() matters: if `changes` itself failed, a
  # plain `needs` would skip these jobs - failing open. !cancelled() runs them
  # anyway, and a missing docs_only output reads as "not docs-only".
  #
  # A newer run on the same pull request cancels these jobs. The older run's
  # lifecycle jobs then skip, before any cluster exists.
  validate-terraform:
    concurrency:
      group: validate-terraform-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    needs: changes
    # != 'false', so a missing output runs the job.
    if: ${{ !cancelled() && needs.changes.outputs.terraform != 'false' }}
    # Narrows away the top-level id-token: write - none of spec 019's
    # checks touch AWS, so this job has no use for an OIDC token.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A shared TF_PLUGIN_CACHE_DIR was tried here and removed: measured over
    # four runs it was consistently slower (7m45s without it, 8m55s-10m11s
    # with), because restoring and saving the cache costs more than the plugin
    # downloads it avoids. The runtime is Terragrunt's per-unit init overhead,
    # not the downloads. Parallelising the unit loop is the fix if this needs
    # to get faster.
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      # -f and the retries are load-bearing: GitHub rate-limits release
      # downloads from the runner pool, and without -f curl saves the error
      # page as the asset and exits 0, so the failure surfaces as a bad
      # checksum instead of the HTTP status that caused it.
      - name: Set up Terragrunt
        run: |
          TG_VERSION=1.1.3
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o terragrunt_linux_amd64 "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o SHA256SUMS "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/SHA256SUMS"
          grep " terragrunt_linux_amd64$" SHA256SUMS | sha256sum -c -
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt

      - name: terraform fmt -check
        run: terraform fmt -check -recursive terraform/

      - name: terraform validate (every module)
        run: |
          set -euo pipefail
          for m in terraform/modules/*/; do
            m="${m%/}"
            echo "== $m =="
            (cd "$m" && terraform init -backend=false -input=false && terraform validate)
          done

      # Units with a `dependency` block are skipped: terragrunt resolves
      # `dependency.x.outputs` by running `terraform output -json` directly
      # in the dependency's own working directory, which hard-fails without
      # a real initialized backend rather than falling back to
      # mock_outputs (reproduced locally against this repo's units, not a
      # config mistake) - giving this job real AWS/S3 reachability just to
      # validate HCL would defeat the point. Their module code is still
      # covered by the loop above; cluster/eks, the five
      # cluster/*-pod-identity units, cluster-civo/{k8s,network},
      # bootstrap/{acm,rolesanywhere} are the ones skipped here.
      - name: terragrunt validate (non-dependency live units)
        run: |
          set -euo pipefail
          export TF_CLI_ARGS_init="-backend=false"
          for u in \
            account-state \
            account/ahorro-ci-role \
            account/eks-access-identity \
            account/eks-test-identity \
            account/github-oidc \
            account/kms \
            account/lab-role \
            account/root-domain \
            bootstrap/route53 \
            persistent-civo/backups \
            persistent-civo/network \
            persistent-civo/reserved-ip \
            persistent-hetzner/network \
            persistent-hetzner/ssh-key \
            persistent/backups \
            persistent/secrets \
            persistent/vpc \
            state; do
            echo "== $u =="
            (cd "terraform/live/$u" && terragrunt validate --non-interactive)
          done

      # soft_fail: report-only for now - a real scan against this repo
      # found 41 findings (3 critical/31 high/7 medium), many likely
      # corresponding to already-documented, deliberate decisions (no NAT
      # gateway/public-only subnets - ADR 0020, lab-role's
      # naming-convention-scoped wildcard, no EKS control-plane logging by
      # cost/lab-scope defaults, etc.), not yet triaged into scoped
      # ignores. Flip to blocking once triaged.
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/
          soft_fail: true
          version: v1.28.14
          # soft_fail does not cover the install: unauthenticated, it hits a shared API rate limit.
          github_token: ${{ secrets.GITHUB_TOKEN }}

  validate-gitops:
    concurrency:
      group: validate-gitops-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "v4.1.4"

      - name: helm lint
        # gitops/argocd is a values.yaml for the Argo CD install script, not
        # a chart directory (no Chart.yaml) - covered by validate-yaml
        # instead.
        run: |
          helm lint gitops/
          helm lint gitops/bootstrap

      # Placeholder values only (constitution's "never a real root domain"
      # rule) - without them envoyGateway.fqdn defaults to "" and
      # HTTPRoute hostnames render as e.g. "argo." (invalid). target=local
      # and per-component values-aws.yaml/values-local.yaml (spec 022
      # Requirement 17) are deferred until spec 022's umbrella-chart split
      # lands - this validates the chart as it actually exists today.
      - name: helm template (target=aws, target=civo, target=hetzner)
        run: |
          set -euo pipefail
          helm template gitops/ \
            --set target=aws \
            --set envoyGateway.fqdn=lab.example.com \
            --set envoyGateway.acmCertificateArn=arn:aws:acm:eu-west-1:123456789012:certificate/dummy \
            --set envoyGateway.nlbSubnetIds=subnet-dummy \
            > rendered-aws.yaml
          helm template gitops/ \
            --set target=civo \
            --set envoyGateway.fqdn=lab.example.com \
            --set envoyGateway.reservedIp=1.2.3.4 \
            --set envoyGateway.firewallId=fw-dummy \
            > rendered-civo.yaml
          helm template gitops/ \
            --set target=hetzner \
            --set envoyGateway.fqdn=lab.example.com \
            --set envoyGateway.location=fsn1 \
            > rendered-hetzner.yaml

      - name: Install kubeconform
        run: |
          KC_VERSION=0.7.0
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors "https://github.com/yannh/kubeconform/releases/download/v${KC_VERSION}/kubeconform-linux-amd64.tar.gz" -o kubeconform.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      # Default schema set doesn't recognize this platform's CRDs
      # (Karpenter, Envoy Gateway, Gateway API, cert-manager,
      # external-secrets, Prometheus Operator, CloudNativePG, barman-cloud) -
      # CRDs-catalog covers those; -ignore-missing-schemas is a last-resort
      # net for anything still unrecognized, not a substitute for it.
      - name: kubeconform
        run: |
          kubeconform -summary -strict -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered-aws.yaml rendered-civo.yaml rendered-hetzner.yaml

  validate-yaml:
    concurrency:
      group: validate-yaml-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install yamllint

      # gitops/templates/**/*.yaml are Helm templates, not plain YAML - bare
      # `{{- if ... }}` lines aren't valid YAML as raw text. Their
      # correctness is covered by helm template + kubeconform (above)
      # instead; yamllint only runs against genuinely plain YAML.
      - run: |
          yamllint -c .yamllint.yml \
            .github/workflows/*.yml \
            gitops/Chart.yaml gitops/values.yaml \
            gitops/bootstrap/*.yaml \
            gitops/argocd/*.yaml

  validate-actions:
    concurrency:
      group: validate-actions-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          AL_VERSION=1.7.12
          AL_ASSET="actionlint_${AL_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$AL_ASSET" "https://github.com/rhysd/actionlint/releases/download/v${AL_VERSION}/${AL_ASSET}"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o checksums.txt "https://github.com/rhysd/actionlint/releases/download/v${AL_VERSION}/actionlint_${AL_VERSION}_checksums.txt"
          grep " ${AL_ASSET}$" checksums.txt | sha256sum -c -
          tar -xzf "$AL_ASSET" actionlint
          sudo mv actionlint /usr/local/bin/actionlint

      - run: actionlint .github/workflows/*.yml

  validate-secrets:
    concurrency:
      group: validate-secrets-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Checks the Makefile owns: gitops-check diffs the rendered aws manifests
  # against the committed golden baseline, specs-check verifies the specs/
  # layout and its links, secrets-check exercises secret-encrypt/decrypt
  # path resolution against a fake aws, node-config-check pins which
  # PROVIDER/REGION pairs the offline gate accepts, pr-gate-check runs
  # pr-gate's own decision step against label and job-result combinations, and
  # argo-up-dispatch-check asserts no target can fall through a provider case.
  # All run with no AWS credentials at all, which is what lets them sit in
  # fast validation.
  validate-repo:
    concurrency:
      group: validate-repo-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # gitops-render-check.sh pipes the render through yq and scripts-check.sh
      # lints with shellcheck; nothing here runs terraform or terragrunt.
      - name: Set up the lab toolchain
        uses: ./.github/actions/setup-lab-tools
        with:
          scope: test
          yq: "true"
          shellcheck: "true"

      - uses: azure/setup-helm@v4
        with:
          version: "v4.1.4"

      - run: make gitops-check

      - run: make specs-check

      # Parses every script, lints it, and runs every tests/scripts/*-test.sh -
      # which is where secrets-check, argo-watch-check, node-config-check and
      # pr-gate-check now run, rather than as four steps of their own.
      - run: make scripts-check

      # Nothing else compiles Go, so until now the E2E suite could fail to
      # build with every check green.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: make go-check

  # Both providers at once, each an independent up -> test -> down chain.
  #
  # Two explicit jobs rather than one matrix job. A matrix would name its legs
  # after the whole row - "lifecycle (aws, vk-lab-ci, ci, true)" - which reads
  # badly in the run graph, collapses both providers into one box, and changes
  # whenever a matrix field is added. Two jobs cost ten duplicated lines and
  # give two stable names and two readable tracks.
  #
  # Neither job needs the other, so they run at the same time, and a failure in
  # one can never stop the other reaching its own teardown. That independence
  # is the whole point; it is not an optimization.
  lifecycle-aws:
    needs: [changes, validate-terraform, validate-gitops, validate-yaml,
            validate-actions, validate-secrets, validate-repo]
    # A called workflow can never hold more permissions than its caller grants,
    # so id-token: write has to be restated here or OIDC fails inside it.
    permissions:
      id-token: write
      contents: read
    # The label is the trigger. It is addable only by someone with write access,
    # which is what keeps an untrusted pull request away from these credentials;
    # the head-repository test is the explicit belt to that braces.
    # The skip label is tested here too, not only in pr-gate: a pull request
    # carrying both labels is a contradiction pr-gate rejects, and it should
    # cost nothing to reject rather than two clusters' worth of runtime first.
    # A skipped validate job must not skip this one; a failed one must.
    if: >-
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.run_aws == 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'ci:skip-lifecycle') &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    # Matches lab.yml's group expression, which is what stops a run here racing
    # a manual dispatch against the same Terraform state.
    concurrency:
      group: lab-aws-vk-lab-ci
      cancel-in-progress: false
    uses: ./.github/workflows/lifecycle-provider.yml
    with:
      provider: aws
      project_name: vk-lab-ci
      subdomain: awsci
      production_tls: true
      # Not github.ref_name: on a pull_request event that is "<n>/merge", which
      # Argo CD cannot resolve. The head SHA is the revision under test.
      target_revision: ${{ github.event.pull_request.head.sha || github.ref_name }}

  lifecycle-civo:
    needs: [changes, validate-terraform, validate-gitops, validate-yaml,
            validate-actions, validate-secrets, validate-repo]
    permissions:
      id-token: write
      contents: read
    # The skip label is tested here too, not only in pr-gate: a pull request
    # carrying both labels is a contradiction pr-gate rejects, and it should
    # cost nothing to reject rather than two clusters' worth of runtime first.
    # A skipped validate job must not skip this one; a failed one must.
    if: >-
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.run_civo == 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'ci:skip-lifecycle') &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: lab-civo-vk-civo-ci
      cancel-in-progress: false
    uses: ./.github/workflows/lifecycle-provider.yml
    with:
      provider: civo
      project_name: vk-civo-ci
      subdomain: civoci
      # Staging certificates: a labeled run happens per pull request, and
      # production orders would burn the Let's Encrypt duplicate-certificate
      # quota this account shares with the personal lab.
      production_tls: false
      target_revision: ${{ github.event.pull_request.head.sha || github.ref_name }}

  # The platform on kind, on the runner itself. Not a caller of
  # lifecycle-provider.yml: that workflow puts up, test and down on three
  # runners, which a cloud cluster outlives and a kind cluster does not - it
  # dies with the job that created it. So one job, and teardown is a step.
  kind-integration:
    # Deliberately NOT the cloud jobs' needs list. Those wait for every static
    # check because a cluster costs money and a failed check means it would be
    # wasted. This one is free, so it starts as soon as the change is
    # classified and runs beside the static checks rather than behind them -
    # waiting for validate-terraform alone would idle it for ten minutes.
    # pr-gate still waits for its result, so nothing merges without it.
    needs: [changes]
    permissions:
      contents: read
    # No label gates this one: it reaches no cloud, needs no credential and
    # costs nothing, so every change that is not documentation-only runs it.
    # ci:skip-lifecycle is absent on purpose - that waiver exists to skip cloud
    # spend, and there is none here to skip.
    #
    # The fork guard still applies. No credential is issued here, but the
    # runner executes workloads this pull request controls, which is the abuse
    # that guard exists for.
    if: >-
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.changes.outputs.docs_only != 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    # Per pull request, and cancellable - unlike the cloud jobs, which must
    # never lose a teardown to a cancellation. Nothing here outlives the runner.
    concurrency:
      group: kind-integration-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROVIDER: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up the lab toolchain
        uses: ./.github/actions/setup-lab-tools
        with:
          # The cheapest arm: it skips the Civo CLI, and nothing here reaches
          # AWS either. `full` is for helm and htpasswd, which argo-up.sh
          # requires outright on this target.
          provider: aws
          scope: full
          kind: true
          argocd: true

      - name: Create the cluster and reconcile the platform
        run: make up
        env:
          # The root Application syncs from this checkout, but its children
          # fetch from git. Left unset they would reconcile main while the root
          # reflects the pull request - a green run against the wrong content.
          TARGET_REVISION: ${{ github.event.pull_request.head.sha || github.ref_name }}
          # The default 900s was measured on a laptop with a warm image cache.
          # A runner pulls every image cold on 4 vCPU.
          LOCAL_CHILDREN_WATCH_SECONDS: "1800"

      - name: Run the E2E suite
        run: make test

      # A kind cluster dies with the runner, so this leaks nothing if it never
      # runs. It stays because it is the only coverage cluster-down-local.sh
      # gets, and separate from the suite so a teardown fault cannot hide a
      # test fault. `make down` on this target takes no CONFIRM_DESTROY.
      - name: Delete the cluster
        if: always()
        run: make down

  # The single required status check on main. Every other job feeds it, and it
  # always reports - a required check that stays pending blocks a merge forever
  # (constitution §11).
  pr-gate:
    needs:
      - changes
      - validate-terraform
      - validate-gitops
      - validate-yaml
      - validate-actions
      - validate-secrets
      - validate-repo
      - lifecycle-aws
      - lifecycle-civo
      - kind-integration
    if: always()
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Decide the gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          TERRAFORM: ${{ needs.changes.outputs.terraform }}
          INFRA: ${{ needs.changes.outputs.infra }}
          INFRA_FILES: ${{ needs.changes.outputs.infra_files }}
          R_TERRAFORM: ${{ needs.validate-terraform.result }}
          R_GITOPS: ${{ needs.validate-gitops.result }}
          R_YAML: ${{ needs.validate-yaml.result }}
          R_ACTIONS: ${{ needs.validate-actions.result }}
          R_SECRETS: ${{ needs.validate-secrets.result }}
          R_REPO: ${{ needs.validate-repo.result }}
          LIFECYCLE_AWS: ${{ needs.lifecycle-aws.result }}
          LIFECYCLE_CIVO: ${{ needs.lifecycle-civo.result }}
          KIND_INTEGRATION: ${{ needs.kind-integration.result }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          WANTS_SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'ci:skip-lifecycle') }}
          WANTS_AWS: ${{ needs.changes.outputs.run_aws }}
          WANTS_CIVO: ${{ needs.changes.outputs.run_civo }}
          # No job exists for this one yet. Named here so the gate can say so
          # out loud rather than let the label do nothing.
          WANTS_HETZNER: ${{ needs.changes.outputs.run_hetzner }}
        run: |
          set -euo pipefail

          # Without a trustworthy classification, nothing below can be decided.
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::could not classify this pull request's changes ($CHANGES_RESULT)."
            exit 1
          fi

          # Each job is judged by name, with the one reason it may skip for; an
          # empty reason means it must run. A looser rule would let a mistyped
          # `if:` stop validation while this gate stayed green.
          DOCS_REASON=""
          if [ "$DOCS_ONLY" = "true" ]; then
            DOCS_REASON="documentation-only change"
          fi
          TF_REASON="$DOCS_REASON"
          if [ "$TERRAFORM" = "false" ]; then
            TF_REASON="no Terraform, Terragrunt or secrets change"
          fi

          COUNT=0
          check() {
            local name="$1" result="$2" skip_reason="$3"
            COUNT=$((COUNT + 1))
            case "$result" in
              success) ;;
              skipped)
                if [ -n "$skip_reason" ]; then
                  echo "$name: skipped - $skip_reason."
                else
                  echo "::error::$name was skipped, but its inputs changed - it must run."
                  exit 1
                fi
                ;;
              *)
                echo "::error::$name did not pass (${result:-no result})."
                exit 1
                ;;
            esac
          }
          check validate-terraform "$R_TERRAFORM" "$TF_REASON"
          check validate-gitops "$R_GITOPS" "$DOCS_REASON"
          check validate-yaml "$R_YAML" "$DOCS_REASON"
          check validate-actions "$R_ACTIONS" "$DOCS_REASON"
          check validate-secrets "$R_SECRETS" ""
          check validate-repo "$R_REPO" ""
          # Judged here rather than with the clouds below: it is not selected,
          # it is not optional, and documentation is the only thing that
          # excuses it.
          check kind-integration "$KIND_INTEGRATION" "$DOCS_REASON"
          # Guards against a check line being deleted rather than a result
          # going missing, which the per-job check above already catches.
          if [ "$COUNT" -ne 7 ]; then
            echo "::error::expected 7 validation results, judged $COUNT."
            exit 1
          fi
          echo "static validation passed, and the platform came up on kind."

          if [ "$EVENT_NAME" != "pull_request" ]; then
            if [ "$LIFECYCLE_AWS" != "success" ] || [ "$LIFECYCLE_CIVO" != "success" ] \
               || [ "$KIND_INTEGRATION" != "success" ]; then
              echo "::error::lifecycle did not pass (aws=$LIFECYCLE_AWS civo=$LIFECYCLE_CIVO local=$KIND_INTEGRATION)."
              exit 1
            fi
            echo "lifecycle passed on every target."
            exit 0
          fi

          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::this pull request comes from a fork. The lifecycle check needs AWS and Civo credentials, and runs the pull request's own workloads on a runner - neither is given to a fork, so a maintainer must re-run it from a branch in this repository."
            exit 1
          fi

          # Two contradictory instructions are an error, not a precedence rule.
          # Picking one silently would make the gate's behavior depend on a
          # rule nobody reading the labels can see.
          if [ "$WANTS_SKIP" = "true" ] \
             && { [ "$WANTS_AWS" = "true" ] || [ "$WANTS_CIVO" = "true" ] || [ "$WANTS_HETZNER" = "true" ]; }; then
            echo "::error::this pull request asks for a cloud lifecycle run and also carries 'ci:skip-lifecycle'. Remove one - they ask for opposite things."
            exit 1
          fi

          # A provider label with no job behind it would otherwise do nothing at
          # all, which is worse than refusing it. hetzner is the last one.
          if [ "$WANTS_HETZNER" = "true" ]; then
            echo "::error::'ci:lifecycle-hetzner' was requested, but no hetzner lifecycle job exists yet. Remove the label."
            exit 1
          fi

          # The backtick is passed as an argument rather than written into the
          # format string: shellcheck reads a backtick inside quotes as a
          # command substitution, whichever quoting style is used.
          BT='`'

          # The waiver. Deliberately loud: a waived merge and a verified merge
          # are otherwise indistinguishable afterwards, and the first question
          # asked when main breaks is whether the change was ever tested. The
          # warning and the summary entry make that answer findable in the run.
          #
          # It waives only the cluster half; static validation above has already
          # had to pass. Frequent use is a signal that the path list is too
          # broad, not that the gate is too strict.
          if [ "$WANTS_SKIP" = "true" ]; then
            if [ "$INFRA" != "true" ]; then
              echo "no infrastructure change - the lifecycle check was not required anyway."
              exit 0
            fi
            echo "::warning::the lifecycle check was WAIVED by the 'ci:skip-lifecycle' label. These files would otherwise have required it."
            printf '%s\n' "$INFRA_FILES" | sed 's/^/  waived: /'
            {
              echo "### Lifecycle check waived"
              echo
              echo "This pull request merged **without** bringing up any cluster."
              printf -- 'It carried the %sci:skip-lifecycle%s label.\n' "$BT" "$BT"
              echo
              echo "Paths that would otherwise have required the check:"
              echo
              printf '%s\n' "$INFRA_FILES" | while IFS= read -r f; do
                printf -- '- %s%s%s\n' "$BT" "$f" "$BT"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Judged against what was asked for, never inferred from the results:
          # a deliberately omitted cloud and an unlabeled pull request both
          # report "skipped", and only one of the two is acceptable.
          GATE=0
          PASSED=""
          OMITTED=""
          for triple in "aws:$LIFECYCLE_AWS:$WANTS_AWS" "civo:$LIFECYCLE_CIVO:$WANTS_CIVO"; do
            name="${triple%%:*}"
            rest="${triple#*:}"
            result="${rest%%:*}"
            wanted="${rest#*:}"
            if [ "$wanted" != "true" ]; then
              OMITTED="$OMITTED $name"
              continue
            fi
            case "$result" in
              success)
                echo "$name: came up, passed make test, and was destroyed."
                PASSED="$PASSED $name" ;;
              *)
                echo "::error::the $name lifecycle did not pass (${result:-no result})."
                GATE=1 ;;
            esac
          done

          # kind proves the chart reconciles, not that a cloud still accepts
          # it: no load balancer, no DNS, no certificate, no workload identity
          # exists on that target. So one cloud must have run and passed before
          # an infrastructure change merges.
          if [ "$INFRA" = "true" ] && [ -z "$PASSED" ] && [ "$GATE" -eq 0 ]; then
            echo "::error::this pull request changes infrastructure, so one cloud must run. Add 'ci:lifecycle-aws' or 'ci:lifecycle-civo' - add every label you want in one edit - or 'ci:skip-lifecycle' to waive it."
            exit 1
          fi

          if [ "$INFRA" != "true" ] && [ -z "$PASSED" ]; then
            echo "no infrastructure change - no cloud run is required for this pull request."
          fi

          # Same reasoning as the waiver block: a partial run and a full run are
          # indistinguishable afterwards unless the run says which clouds it
          # never touched.
          if [ -n "$OMITTED" ]; then
            echo "::warning::the lifecycle check ran on a subset of clouds. Not exercised:$OMITTED"
            {
              echo "### Lifecycle check ran on a subset of clouds"
              echo
              echo "Not exercised by this pull request:"
              echo
              for name in $OMITTED; do
                printf -- '- %s%s%s\n' "$BT" "$name" "$BT"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$GATE"
