name: lifecycle-test

# The merge gate. Static checks on every pull request; a full two-provider
# lifecycle - full-up, make test, full-down against one AWS cluster and one
# Civo cluster at the same time - when a maintainer adds the `ci:lifecycle`
# label. `pr-gate` below is the single required status check on main.
#
# The heavy half is opt-in because it costs roughly 55 minutes and a little
# under a dollar. Adding the label starts it against the pull request's current
# head commit; removing and re-adding the label is the re-run handle.
#
# Isolation is by PROJECT_NAME/SUBDOMAIN (ADR 0026), not a separate
# terraform/live/ci/ tree - a documented deviation from spec AWS-020
# Requirement 2, reusing the per-project isolation lab.yml already has.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_dispatch:

run-name: >-
  lifecycle-test${{ github.event_name == 'pull_request' && format(' (#{0})', github.event.pull_request.number) || ' (manual)' }}

# Per pull request, not per project: a new push supersedes nothing, because
# cancelling a run would kill its teardown job and leak a cluster. The
# per-project serialization that protects Terraform state is a separate group,
# declared on the `lifecycle` job below.
concurrency:
  group: lifecycle-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  # Static checks (spec 019/architecture.md §26), folded into this
  # manually-triggered workflow rather than a separate PR-triggered
  # validate.yml - one verification entrypoint for now; PR enforcement is a
  # deliberate later step, not implemented here. These gate `up` so a
  # failure costs no AWS time/spend.
  validate-terraform:
    # Narrows away the top-level id-token: write - none of spec 019's
    # checks touch AWS, so this job has no use for an OIDC token.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - name: Set up Terragrunt
        run: |
          TG_VERSION=1.1.3
          curl -sSL -o terragrunt_linux_amd64 "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          curl -sSL -o SHA256SUMS "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/SHA256SUMS"
          grep " terragrunt_linux_amd64$" SHA256SUMS | sha256sum -c -
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt

      - name: terraform fmt -check
        run: terraform fmt -check -recursive terraform/

      - name: terraform validate (every module)
        run: |
          set -euo pipefail
          for m in terraform/modules/*/; do
            m="${m%/}"
            echo "== $m =="
            (cd "$m" && terraform init -backend=false -input=false && terraform validate)
          done

      # Units with a `dependency` block are skipped: terragrunt resolves
      # `dependency.x.outputs` by running `terraform output -json` directly
      # in the dependency's own working directory, which hard-fails without
      # a real initialized backend rather than falling back to
      # mock_outputs (reproduced locally against this repo's units, not a
      # config mistake) - giving this job real AWS/S3 reachability just to
      # validate HCL would defeat the point. Their module code is still
      # covered by the loop above; cluster/eks, the five
      # cluster/*-pod-identity units, cluster-civo/{k8s,network},
      # bootstrap/{acm,rolesanywhere} are the ones skipped here.
      - name: terragrunt validate (non-dependency live units)
        run: |
          set -euo pipefail
          export TF_CLI_ARGS_init="-backend=false"
          for u in \
            account-state \
            account/eks-access-identity \
            account/eks-test-identity \
            account/github-oidc \
            account/kms \
            account/lab-role \
            account/root-domain \
            bootstrap/route53 \
            persistent-civo/backups \
            persistent-civo/network \
            persistent-civo/reserved-ip \
            persistent/backups \
            persistent/secrets \
            persistent/vpc \
            state; do
            echo "== $u =="
            (cd "terraform/live/$u" && terragrunt validate --non-interactive)
          done

      # soft_fail: report-only for now - a real scan against this repo
      # found 41 findings (3 critical/31 high/7 medium), many likely
      # corresponding to already-documented, deliberate decisions (no NAT
      # gateway/public-only subnets - ADR 0020, lab-role's
      # naming-convention-scoped wildcard, no EKS control-plane logging by
      # cost/lab-scope defaults, etc.), not yet triaged into scoped
      # ignores. Flip to blocking once triaged.
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/
          soft_fail: true

  validate-gitops:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "v4.1.4"

      - name: helm lint
        # gitops/argocd is a values.yaml for the Argo CD install script, not
        # a chart directory (no Chart.yaml) - covered by validate-yaml
        # instead.
        run: |
          helm lint gitops/
          helm lint gitops/bootstrap

      # Placeholder values only (constitution's "never a real root domain"
      # rule) - without them envoyGateway.fqdn defaults to "" and
      # HTTPRoute hostnames render as e.g. "argo." (invalid). target=local
      # and per-component values-aws.yaml/values-local.yaml (spec 022
      # Requirement 17) are deferred until spec 022's umbrella-chart split
      # lands - this validates the chart as it actually exists today.
      - name: helm template (target=aws, target=civo)
        run: |
          set -euo pipefail
          helm template gitops/ \
            --set target=aws \
            --set envoyGateway.fqdn=lab.example.com \
            --set envoyGateway.acmCertificateArn=arn:aws:acm:eu-west-1:123456789012:certificate/dummy \
            --set envoyGateway.nlbSubnetIds=subnet-dummy \
            > rendered-aws.yaml
          helm template gitops/ \
            --set target=civo \
            --set envoyGateway.fqdn=lab.example.com \
            --set envoyGateway.reservedIp=1.2.3.4 \
            --set envoyGateway.firewallId=fw-dummy \
            > rendered-civo.yaml

      - name: Install kubeconform
        run: |
          KC_VERSION=0.7.0
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KC_VERSION}/kubeconform-linux-amd64.tar.gz" -o kubeconform.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      # Default schema set doesn't recognize this platform's CRDs
      # (Karpenter, Envoy Gateway, Gateway API, cert-manager,
      # external-secrets, Prometheus Operator, CloudNativePG, barman-cloud) -
      # CRDs-catalog covers those; -ignore-missing-schemas is a last-resort
      # net for anything still unrecognized, not a substitute for it.
      - name: kubeconform
        run: |
          kubeconform -summary -strict -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered-aws.yaml rendered-civo.yaml

  validate-yaml:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install yamllint

      # gitops/templates/**/*.yaml are Helm templates, not plain YAML - bare
      # `{{- if ... }}` lines aren't valid YAML as raw text. Their
      # correctness is covered by helm template + kubeconform (above)
      # instead; yamllint only runs against genuinely plain YAML.
      - run: |
          yamllint -c .yamllint.yml \
            .github/workflows/*.yml \
            gitops/Chart.yaml gitops/values.yaml \
            gitops/bootstrap/*.yaml \
            gitops/argocd/*.yaml

  validate-actions:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          AL_VERSION=1.7.12
          AL_ASSET="actionlint_${AL_VERSION}_linux_amd64.tar.gz"
          curl -sSL -o "$AL_ASSET" "https://github.com/rhysd/actionlint/releases/download/v${AL_VERSION}/${AL_ASSET}"
          curl -sSL -o checksums.txt "https://github.com/rhysd/actionlint/releases/download/v${AL_VERSION}/actionlint_${AL_VERSION}_checksums.txt"
          grep " ${AL_ASSET}$" checksums.txt | sha256sum -c -
          tar -xzf "$AL_ASSET" actionlint
          sudo mv actionlint /usr/local/bin/actionlint

      - run: actionlint .github/workflows/*.yml

  validate-secrets:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Both providers at once, each an independent up -> test -> down chain.
  # Two checks the Makefile already owns and no workflow ran until now:
  # gitops-check diffs the rendered aws manifests against the committed golden
  # baseline, and specs-check verifies the specs/ layout and its links.
  validate-repo:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # gitops-render-check.sh pipes the render through yq; nothing here runs
      # terraform or terragrunt.
      - name: Set up the lab toolchain
        uses: ./.github/actions/setup-lab-tools
        with:
          scope: test
          yq: "true"

      - uses: azure/setup-helm@v4
        with:
          version: "v4.1.4"

      - run: make gitops-check

      - run: make specs-check

  lifecycle:
    needs:
      - validate-terraform
      - validate-gitops
      - validate-yaml
      - validate-actions
      - validate-secrets
      - validate-repo
    # A called workflow can never hold more permissions than its caller grants,
    # so id-token: write has to be restated here or OIDC fails inside it.
    permissions:
      id-token: write
      contents: read
    # The label is the trigger. It is addable only by someone with write access,
    # which is what keeps an untrusted pull request away from these credentials;
    # the head-repository test is the explicit belt to that braces.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'ci:lifecycle') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      # Without this, a failing AWS leg cancels the Civo leg mid-flight and
      # leaks a Civo cluster. Each provider must always reach its own teardown.
      fail-fast: false
      matrix:
        include:
          - provider: aws
            project: vk-lab-ci
            subdomain: ci
            production_tls: true
          # Staging certificates: a labeled run happens per pull request, and
          # production orders would burn the Let's Encrypt duplicate-certificate
          # quota this account shares with the personal lab.
          - provider: civo
            project: vk-civo-ci
            subdomain: civoci
            production_tls: false
    # Matches lab.yml's group expression, which is what stops a run here racing
    # a manual dispatch against the same Terraform state.
    concurrency:
      group: lab-${{ matrix.provider }}-${{ matrix.project }}
      cancel-in-progress: false
    uses: ./.github/workflows/lifecycle-provider.yml
    with:
      provider: ${{ matrix.provider }}
      project_name: ${{ matrix.project }}
      subdomain: ${{ matrix.subdomain }}
      production_tls: ${{ matrix.production_tls }}
      # Not github.ref_name: on a pull_request event that is "<n>/merge", which
      # Argo CD cannot resolve. The head SHA is the revision under test.
      target_revision: ${{ github.event.pull_request.head.sha || github.ref_name }}

  # The single required status check on main. Every other job feeds it, and it
  # always reports - a required check that stays pending blocks a merge forever
  # (constitution §11).
  pr-gate:
    needs:
      - validate-terraform
      - validate-gitops
      - validate-yaml
      - validate-actions
      - validate-secrets
      - validate-repo
      - lifecycle
    if: always()
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide the gate
        env:
          VALIDATE_RESULTS: >-
            ${{ needs.validate-terraform.result }} ${{ needs.validate-gitops.result }}
            ${{ needs.validate-yaml.result }} ${{ needs.validate-actions.result }}
            ${{ needs.validate-secrets.result }} ${{ needs.validate-repo.result }}
          LIFECYCLE_RESULT: ${{ needs.lifecycle.result }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          for r in $VALIDATE_RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::static validation did not pass ($VALIDATE_RESULTS)."
              exit 1
            fi
          done
          echo "static validation passed."

          if [ "$EVENT_NAME" != "pull_request" ]; then
            [ "$LIFECYCLE_RESULT" = "success" ] || {
              echo "::error::the lifecycle run did not pass ($LIFECYCLE_RESULT)."; exit 1; }
            echo "lifecycle passed."
            exit 0
          fi

          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::this pull request comes from a fork. The lifecycle check needs AWS and Civo credentials, which a fork never receives - a maintainer must re-run it from a branch in this repository."
            exit 1
          fi

          # Which files this pull request touches decides whether the heavy
          # check is required at all. Without this, a one-line README fix could
          # not merge without spending ~55 minutes on two clouds. Constitution
          # §11 asks the gate to report success OR an explicit skip.
          git fetch --quiet origin "$BASE_REF"
          CHANGED="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          echo "changed files:"
          printf '%s\n' "$CHANGED" | sed 's/^/  /'

          # This list is the merge-blocking surface of the repository.
          if printf '%s\n' "$CHANGED" | grep -qE '^(terraform/|gitops/|scripts/|tests/|images/|go\.(mod|sum)$|Makefile$|\.github/(workflows|actions)/)'; then
            INFRA=yes
          else
            INFRA=no
          fi

          if [ "$INFRA" = "no" ]; then
            echo "no infrastructure change - the lifecycle check is not required for this pull request."
            exit 0
          fi

          case "$LIFECYCLE_RESULT" in
            success)
              echo "both providers came up, passed make test, and were destroyed." ;;
            skipped)
              echo "::error::this pull request changes infrastructure, so it needs the full lifecycle check. Add the 'ci:lifecycle' label to run it."
              exit 1 ;;
            *)
              echo "::error::the lifecycle check did not pass ($LIFECYCLE_RESULT)."
              exit 1 ;;
          esac
