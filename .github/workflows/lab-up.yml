name: lab-up

# Manually triggered only - this starts real, billable AWS infrastructure.
# project_name/subdomain/region are bounded choices, not free text: the
# assumed role's policy is hand-enumerated to exactly this one combination.
on:
  workflow_dispatch:
    inputs:
      project_name:
        description: PROJECT_NAME
        type: choice
        options: [vk-lab-platform]
        default: vk-lab-platform
      subdomain:
        description: SUBDOMAIN
        type: choice
        options: [lab]
        default: lab
      region:
        description: REGION
        type: choice
        options: [eu-west-1]
        default: eu-west-1
      depth:
        description: depth
        type: choice
        options: [up, full-up]
        default: up

permissions:
  id-token: write
  contents: read

jobs:
  up:
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: ${{ inputs.project_name }}
      SUBDOMAIN: ${{ inputs.subdomain }}
      REGION: ${{ inputs.region }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9" # matches every module's required_version
          terraform_wrapper: false # the wrapper breaks terragrunt's own stdout/stderr capture

      # No official Terragrunt setup action - ubuntu-latest doesn't ship it
      # (unlike aws-cli/kubectl/helm/jq, confirmed already present). Pinned
      # release binary, checksum-verified before trusting it.
      - name: Set up Terragrunt
        run: |
          TG_VERSION=1.1.3
          curl -sSL -o terragrunt_linux_amd64 "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          curl -sSL -o SHA256SUMS "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/SHA256SUMS"
          grep " terragrunt_linux_amd64$" SHA256SUMS | sha256sum -c -
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
          role-duration-seconds: 14400 # full-up can run close to/over an hour; matches the role's own max_session_duration

      # ROOT_DOMAIN is a GitHub secret, not decrypted from secrets/root-domain.enc -
      # only needed when depth=full-up reaches persistent-up; harmless to set
      # unconditionally otherwise (make up never reads it).
      - run: make ${{ inputs.depth }}
        env:
          ROOT_DOMAIN: ${{ secrets.ROOT_DOMAIN }}
